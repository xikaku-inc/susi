[package]
name = "susi_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "susi-server"
path = "src/main.rs"

[dependencies]
susi_core = { path = "../susi_core", features = ["db"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rsa = { version = "0.9", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
x509-cert = { version = "0.2", default-features = false }
spki = "0.7"
ring = "0.17"
base64 = "0.22"
argon2 = "0.5"
jsonwebtoken = "9"
# Poison-free locks: a panic while holding the DB mutex must not wedge
# every subsequent request the way a poisoned std::sync::Mutex would.
parking_lot = "0.12"
totp-rs = { version = "5", features = ["qr"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
url = "2"
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
ammonia = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Dropbox backups: tar.gz the data dir, encrypt with chunked AES-256-GCM.
tar = "0.4"
flate2 = "1"
aes-gcm = "0.10"
# S3 storage for workspace recordings. Susi only generates presigned URLs +
# does HeadObject/DeleteObject; bytes never traverse the susi server.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

[dev-dependencies]
susi_client = { path = "../susi_client" }
susi_core = { path = "../susi_core" }
reqwest = { workspace = true }
tempfile = "3"
rcgen = "0.13"
# Mock Dropbox endpoint for backup integration tests + archive inspection.
axum = "0.8"
tokio = { workspace = true }
tar = "0.4"
flate2 = "1"
totp-rs = { version = "5", features = ["gen_secret"] }
# Sign synthetic Stripe webhook payloads in integration tests.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
