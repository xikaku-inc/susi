<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FusionHub Documentation</title>
<script>
// Apply theme before paint to avoid a flash of the wrong colour scheme.
(function () {
    const t = localStorage.getItem('susi_theme') || 'system';
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
<link rel="stylesheet" href="/docs/easymde.css">
<script src="/docs/easymde.js" defer></script>
<style>
:root {
    --bg: #0f1115;
    --bg2: #161922;
    --bg3: #1d212c;
    --border: #262b38;
    --text1: #e6e8ec;
    --text2: #9aa0aa;
    --accent: #6aa9ff;
    --accent-soft: rgba(106,169,255,0.15);
    --code-bg: #11141b;
    --radius: 6px;
    --sidebar-width: 280px;
}
:root[data-theme="light"] {
    --bg: #ffffff;
    --bg2: #f5f6f8;
    --bg3: #eceef2;
    --border: #d8dbe1;
    --text1: #1a1d23;
    --text2: #5c6470;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,0.10);
    --code-bg: #f1f3f6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* Dark scrollbars to match the rest of the UI. */
* {
    scrollbar-width: thin;
    scrollbar-color: var(--bg3) var(--bg2);
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: var(--bg2); }
*::-webkit-scrollbar-thumb {
    background: var(--bg3);
    border-radius: 5px;
    border: 2px solid var(--bg2);
}
*::-webkit-scrollbar-thumb:hover { background: var(--border); }
*::-webkit-scrollbar-corner { background: var(--bg2); }
body {
    background: var(--bg);
    color: var(--text1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
}
.header {
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    /* Above the mobile sidebar drawer (150) and its overlay (140) so the
       header dropdowns (kebab, More) paint over them; below the image
       lightbox (200). The sticky header is a stacking context, so its
       children can never exceed this value. */
    z-index: 160;
}
.header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
}
.header h1 a { color: inherit; text-decoration: none; }
.header-left { display: flex; align-items: center; gap: 24px; }
.header-left .brand {
    color: inherit; text-decoration: none;
    font-size: 15px; font-weight: 600;
    white-space: nowrap;
}
.top-nav { display: flex; gap: 4px; align-items: center; }
.top-nav a {
    padding: 6px 12px;
    border-radius: var(--radius);
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    white-space: nowrap;
}
.top-nav a:hover { background: var(--bg3); color: var(--text1); }
.top-nav a.active {
    color: var(--accent);
    background: rgba(106,169,255,0.10);
}
.nav-group { position: relative; display: inline-block; }
.nav-group > button {
    background: none;
    border: 1px solid transparent;
    color: var(--text2);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
}
.nav-group > button:hover { background: var(--bg3); color: var(--text1); }
.nav-group-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    min-width: 160px;
    padding: 4px 0;
    z-index: 500;
}
.nav-group-menu.open { display: block; }
.nav-group-menu a {
    display: block;
    padding: 8px 14px;
    color: var(--text1);
    text-decoration: none;
    font-size: 13px;
}
.nav-group-menu a:hover { background: var(--bg3); }
.nav-group-menu a.active { color: var(--accent); }
.nav-group-menu .menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
/* Mobile-only header kebab menu; the edit/login controls are DOM-moved into
   it (and the pickers into the sidebar drawer) below 720px. */
.docs-more { position: relative; display: none; }
.docs-more-menu { left: auto; right: 0; }
.docs-more-menu .btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 0;
    padding: 8px 14px;
    min-height: 0;
}
.docs-more-menu .btn:hover { background: var(--bg3); }
/* Site nav + picker slots inside the mobile sidebar drawer - hidden on
   desktop where the top nav and header controls are visible. */
.site-nav-mobile { display: none; }
.drawer-pickers { display: none; }
.header-right { display: flex; gap: 10px; align-items: center; }
.release-picker {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text1);
    padding: 5px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: "SF Mono", "Consolas", monospace;
    /* Shrinkable: the pickers absorb width pressure before anything else
       in the header has to give. */
    min-width: 60px;
    max-width: 200px;
}
.release-picker:focus { outline: 1px solid var(--accent); }
.btn {
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text1);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    min-height: 32px;
    white-space: nowrap;
}
.btn:hover { background: var(--bg3); }
.nav-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text1);
    width: 40px; height: 36px;
    border-radius: var(--radius);
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
}
.nav-toggle:hover { background: var(--bg3); }
.nav-toggle svg { width: 20px; height: 20px; display: block; stroke: currentColor; }
.nav-overlay {
    position: fixed; inset: 56px 0 0 0;
    background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 140;
}
.nav-overlay.open { opacity: 1; pointer-events: auto; }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #e2615e; }

.layout {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr 240px;
    min-height: calc(100vh - 56px);
}
.layout.no-toc { grid-template-columns: var(--sidebar-width) 1fr; }
.layout.no-toc .toc-rail { display: none; }
.sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg2);
    padding: 16px 0;
    overflow-y: auto;
    max-height: calc(100vh - 56px);
    position: sticky;
    top: 56px;
}
.sidebar h3 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 14px 16px 6px;
}
.sidebar a {
    display: block;
    color: var(--text1);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 16px 5px 24px;
    border-left: 2px solid transparent;
}
.sidebar a:hover { background: var(--bg3); }
.sidebar a.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
}
.sidebar a.section-head {
    padding-left: 16px;
    font-weight: 500;
}
.sidebar .empty { padding: 16px; color: var(--text2); font-size: 13px; }

.content {
    padding: 32px 48px;
    max-width: 920px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
}
.content.full { max-width: none; }
.content h1 { font-size: 28px; margin: 0 0 16px; font-weight: 600; line-height: 1.3; }
.content h2 { font-size: 20px; margin: 28px 0 12px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.content h3 { font-size: 16px; margin: 22px 0 10px; font-weight: 600; }
.content h4 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; color: var(--text2); }
.content p { margin: 10px 0; }
.content code {
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "SF Mono", "Consolas", "Fira Code", monospace;
    font-size: 12.5px;
}
.content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
    margin: 14px 0;
}
.content pre code { background: transparent; padding: 0; font-size: inherit; }
.content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 8px 14px;
    margin: 14px 0;
    color: var(--text1);
    border-radius: 0 var(--radius) var(--radius) 0;
}
.content table {
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 13px;
    width: 100%;
}
.content .table-scroll { overflow-x: auto; max-width: 100%; margin: 14px 0; -webkit-overflow-scrolling: touch; }
.content .table-scroll table { margin: 0; }
.content th, .content td {
    border: 1px solid var(--border);
    padding: 7px 11px;
    text-align: left;
    vertical-align: top;
}
.content th { background: var(--bg2); font-weight: 600; }
.content tr:nth-child(even) td { background: var(--bg2); }
.content td ul.cell-list { margin: 0; padding-left: 18px; }
.content td ul.cell-list li { margin: 2px 0; }
.content table.gallery-table { table-layout: fixed; }
.content ul, .content ol { margin: 10px 0; padding-left: 24px; }
.content li { margin: 4px 0; }
.content a { color: var(--accent); text-decoration: none; }
.content a:hover { text-decoration: underline; }
.content img { max-width: 100%; border-radius: var(--radius); display: block; margin: 16px auto; }
.content .video-embed { position: relative; padding-top: 56.25%; margin: 16px 0; }
.content .video-embed iframe {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; border: 0;
    border-radius: var(--radius);
}
.content hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
/* Inline [TOC] tag */
.content .doc-toc {
    display: block;
    border: 1px solid var(--border);
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin: 18px 0;
}
.content .doc-toc .doc-toc-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
}
.content .doc-toc a { display: block; color: var(--accent); text-decoration: none; padding: 3px 0; line-height: 1.4; }
.content .doc-toc a:hover { text-decoration: underline; }
.content .doc-toc a.doc-toc-lvl-3 { padding-left: 16px; font-size: 13px; }
/* Allow inline icons in tables not to be forced to a new line */
.content td img, .content th img { display: inline-block; margin: 0; }
/* Anchor offset for sticky header so jumps don't hide titles. */
.content h1, .content h2, .content h3, .content h4 { scroll-margin-top: 72px; }

.meta {
    color: var(--text2);
    font-size: 12px;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
}

.editor {
    width: 100%;
    min-height: 70vh;
    background: var(--code-bg);
    color: var(--text1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.55;
    resize: vertical;
}
.editor:focus { outline: 1px solid var(--accent); }
.editor.drop-target { outline: 2px dashed var(--accent); outline-offset: -4px; }

/* EasyMDE theme overrides — match the surrounding dark UI. */
.EasyMDEContainer { background: var(--bg); }
.EasyMDEContainer .CodeMirror {
    background: var(--code-bg);
    color: var(--text1);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    min-height: 480px;
    font-family: "SF Mono", "Consolas", "Fira Code", monospace;
    font-size: 13px;
}
.EasyMDEContainer .CodeMirror-cursor { border-color: var(--text1); }
.EasyMDEContainer .CodeMirror-selected { background: var(--accent-soft) !important; }
.EasyMDEContainer .CodeMirror-line { color: var(--text1); }
.editor-toolbar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: none;
    opacity: 1 !important;
    position: sticky;
    top: 56px;
    z-index: 9;
}
.editor-toolbar button {
    color: var(--text1) !important;
    border: 1px solid transparent !important;
    border-radius: 4px !important;
    padding: 4px 8px !important;
    font-size: 12px !important;
    font-weight: 500;
    background: transparent !important;
    min-width: 32px;
    text-align: center;
}
.editor-toolbar button:hover, .editor-toolbar button.active {
    background: var(--bg3) !important;
    border-color: var(--border) !important;
}
.editor-toolbar i.separator { border-left: 1px solid var(--border); margin: 0 4px; }
.editor-statusbar {
    background: var(--bg2);
    color: var(--text2);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 4px 10px;
    font-size: 11px;
}
.EasyMDEContainer .editor-preview, .EasyMDEContainer .editor-preview-side {
    background: var(--bg);
    color: var(--text1);
    border: 1px solid var(--border);
    padding: 16px 20px;
}
.EasyMDEContainer .editor-preview-active-side { display: block; }
.EasyMDEContainer .editor-preview img,
.EasyMDEContainer .editor-preview-side img {
    max-width: 100%;
    border-radius: var(--radius);
}
.EasyMDEContainer .editor-preview .video-embed,
.EasyMDEContainer .editor-preview-side .video-embed { position: relative; padding-top: 56.25%; margin: 16px 0; }
.EasyMDEContainer .editor-preview .video-embed iframe,
.EasyMDEContainer .editor-preview-side .video-embed iframe {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; border: 0;
    border-radius: var(--radius);
}
.EasyMDEContainer .editor-preview h1,
.EasyMDEContainer .editor-preview-side h1 { font-size: 22px; margin: 0 0 12px; }
.EasyMDEContainer .editor-preview h2,
.EasyMDEContainer .editor-preview-side h2 { font-size: 17px; margin: 18px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.EasyMDEContainer .editor-preview code,
.EasyMDEContainer .editor-preview-side code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.EasyMDEContainer .editor-preview pre,
.EasyMDEContainer .editor-preview-side pre { background: var(--code-bg); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius); }
.EasyMDEContainer .editor-preview table,
.EasyMDEContainer .editor-preview-side table { border-collapse: collapse; width: 100%; font-size: 12px; }
.EasyMDEContainer .editor-preview th, .EasyMDEContainer .editor-preview td,
.EasyMDEContainer .editor-preview-side th, .EasyMDEContainer .editor-preview-side td {
    border: 1px solid var(--border); padding: 5px 8px; text-align: left;
}
.EasyMDEContainer .editor-preview th,
.EasyMDEContainer .editor-preview-side th { background: var(--bg2); }

.edit-meta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    align-items: center;
}
.edit-meta-row label { font-size: 12px; color: var(--text2); }
.edit-meta-row input, .edit-meta-row select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text1);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
}
.edit-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    align-items: center;
}
.edit-meta input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text1);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
}
.edit-meta label {
    font-size: 12px;
    color: var(--text2);
    margin-right: 4px;
}
.edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 12px 0;
    border-top: 1px solid var(--border);
    z-index: 9;
}

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text1);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
}
.toast.visible { opacity: 1; }
.toast.error { border-color: #e2615e; color: #e2615e; }
.toast.success { border-color: #5fb878; color: #5fb878; }

.empty-state {
    color: var(--text2);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
}
.empty-state h2 { color: var(--text1); margin-bottom: 8px; }

/* Right-side table of contents */
.toc-rail {
    border-left: 1px solid var(--border);
    background: var(--bg);
    padding: 24px 18px;
    overflow-y: auto;
    max-height: calc(100vh - 56px);
    position: sticky;
    top: 56px;
    font-size: 12.5px;
}
.toc-rail .toc-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
}
.toc-rail a {
    display: block;
    color: var(--text2);
    text-decoration: none;
    padding: 4px 0;
    border-left: 2px solid transparent;
    padding-left: 10px;
    line-height: 1.4;
}
.toc-rail a:hover { color: var(--text1); }
.toc-rail a.active {
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
}
.toc-rail a.lvl-3 { padding-left: 22px; font-size: 12px; }
.toc-rail a.lvl-4 { padding-left: 34px; font-size: 11.5px; color: var(--text2); }

@media (max-width: 1100px) {
    .layout,
    .layout.no-toc { grid-template-columns: var(--sidebar-width) 1fr; }
    .toc-rail { display: none; }
}
@media (max-width: 900px) {
    :root { --sidebar-width: 220px; }
    .content { padding: 28px 28px; }
}
@media (max-width: 1150px) {
    /* Mid widths: the edit/login buttons collapse into the header kebab and
       the workspace banner goes; pickers shrink but stay in the header. */
    #wsBanner { display: none !important; }
    .docs-more { display: inline-block; }
}
@media (max-width: 720px) {
    .layout,
    .layout.no-toc { grid-template-columns: 1fr; }
    .sidebar {
        position: fixed;
        top: 56px;
        left: 0;
        width: 280px;
        max-width: 80vw;
        height: calc(100vh - 56px);
        max-height: none;
        border-right: 1px solid var(--border);
        border-bottom: none;
        z-index: 150;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .nav-toggle { display: inline-flex; }
    .content { padding: 20px 16px; max-width: 100%; }
    .content h1 { font-size: 24px; }
    .content h2 { font-size: 18px; }
    .header { padding: 0 12px; }
    .header-left { gap: 8px; }
    .header-left .brand { font-size: 14px; }
    .top-nav { display: none; }
    .site-nav-mobile {
        display: block;
        padding: 4px 8px 8px;
        border-bottom: 1px solid var(--border);
    }
    .site-nav-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: none;
        border: none;
        color: var(--text1);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 14px;
        border-radius: var(--radius);
        cursor: pointer;
    }
    .site-nav-head:hover { background: var(--bg3); }
    .site-nav-head .chev { color: var(--text2); transition: transform 0.15s ease; }
    .site-nav-mobile.open .site-nav-head .chev { transform: rotate(90deg); }
    #siteNavLinks { display: none; }
    .site-nav-mobile.open #siteNavLinks { display: block; }
    .site-nav-mobile a {
        display: block;
        padding: 10px 14px;
        border-left: none;
        border-radius: var(--radius);
        font-size: 14px;
    }
    .site-nav-mobile .site-nav-label {
        padding: 12px 14px 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text2);
    }
    .drawer-pickers {
        display: block;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
    }
    .drawer-pickers .drawer-ws-name {
        font-size: 12px;
        color: var(--text2);
        padding: 0 2px 6px;
    }
    .drawer-pickers select {

    .release-picker { min-width: 100px; max-width: 130px; }

}

<script>
// Theme handling — shared key 'susi_theme' so dashboard + docs stay in sync per-origin.
function applyTheme(t) {
    const root = document.documentElement;
    if (t === 'system') {
        root.removeAttribute('data-theme');
        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (prefersLight) root.setAttribute('data-theme', 'light');
    } else {
        root.setAttribute('data-theme', t);
    }
    const btn = document.getElementById('btnTheme');
    if (btn) {
        btn.textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🌓';
        btn.title = 'Theme: ' + t + ' (click to cycle)';
    }
}
function cycleTheme() {
    const cur = localStorage.getItem('susi_theme') || 'system';
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'system' : 'dark';
    localStorage.setItem('susi_theme', next);
    applyTheme(next);
}
function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('navOverlay');
    if (!sb) return;
    const open = sb.classList.toggle('open');
    if (ov) ov.classList.toggle('open', open);
}
function closeSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('navOverlay');
    if (sb) sb.classList.remove('open');
    if (ov) ov.classList.remove('open');
}
document.addEventListener('click', (e) => {
    const sb = document.getElementById('sidebar');
    if (!sb || !sb.classList.contains('open')) return;
    const a = e.target.closest('a');
    if (a && sb.contains(a)) closeSidebar();
});
applyTheme(localStorage.getItem('susi_theme') || 'system');
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
        if ((localStorage.getItem('susi_theme') || 'system') === 'system') applyTheme('system');
    });
}

const API = '/api/v1';
let releases = [];
let products = [];
let currentProduct = 'fusionhub';
let currentTag = null;

// Base path for doc page/asset operations. Workspace docs go through the legacy
// (default-product) routes; global docs are product-scoped.
function docBase() {
    return currentWorkspaceId
        ? API + '/docs'
        : API + '/products/' + encodeURIComponent(currentProduct) + '/docs';
}
let pages = [];        // [{slug, title, parent_slug, ord, updated_at}]
let assets = [];       // [{name, size}]
let currentSlug = null;
let currentPage = null; // {title, body_md, parent_slug, ord, updated_at}
let editMode = false;

// Workspace mode: when ?workspace=<id> is present in the URL, the editor
// scopes itself to that workspace. The release listing comes from a
// workspace-only endpoint and all read fetches send auth (workspace doc reads
// require membership). Initial tag may also be pinned via ?tag=<tag>.
const workspaceParams = new URLSearchParams(location.search);
const currentWorkspaceId = workspaceParams.get('workspace') || null;
const initialTagParam = workspaceParams.get('tag') || null;
let currentWorkspaceName = null;

// Deep links carry the product as `?product=<slug>` (absent = the default
// product, so existing FusionHub links keep working). Not applicable in
// workspace mode, where docs aren't product-scoped.
if (!currentWorkspaceId) {
    const p = workspaceParams.get('product');
    if (p) currentProduct = p;
}

// Keep the address bar in sync with the selected product so the URL shown is a
// shareable deep link. The default product is omitted to keep URLs clean.
function syncProductInUrl() {
    const url = new URL(location.href);
    if (currentProduct && currentProduct !== 'fusionhub') {
        url.searchParams.set('product', currentProduct);
    } else {
        url.searchParams.delete('product');
    }
    history.replaceState(null, '', url.toString());
}

// Edit-permission detection. Site admins can edit any docs; in workspace mode
// a workspace member can too (`isWorkspaceEditor` flips once the workspace
// fetch below succeeds, which the backend only allows for members/admins).
// Both are confirmed against the server; a JWT alone is not enough.
function authToken() { return localStorage.getItem('auth_token') || ''; }
let isAdminUser = false;
let isWorkspaceEditor = false;
function canEditDocs() { return isAdminUser || isWorkspaceEditor; }
function refreshEditButtons() {
    const editBtn = document.getElementById('editBtn');
    const newBtn = document.getElementById('newPageBtn');
    if (editBtn && currentPage) editBtn.style.display = canEditDocs() ? '' : 'none';
    if (newBtn) newBtn.style.display = (canEditDocs() && currentTag) ? '' : 'none';
    // "+ Version" lets an admin start a fresh version for the current product.
    // Hidden in workspace mode (releases there are created from the Workspaces
    // page and are workspace-scoped).
    const verBtn = document.getElementById('newVersionBtn');
    if (verBtn) verBtn.style.display = (isAdminUser && !currentWorkspaceId) ? '' : 'none';
}

// Build fetch options that automatically include Authorization when we have a
// token. Workspace doc reads require auth on the backend, so we send it for
// every doc-related fetch when a token exists. Safe for global docs too.
function docHeaders(extra) {
    const h = Object.assign({}, extra || {});
    if (authToken()) h['Authorization'] = 'Bearer ' + authToken();
    return h;
}

// Render the same top nav that dashboard.html uses, so users can jump
// back to Releases/Workspaces/Licenses without losing the susi shell.
async function renderTopNav() {
    const nav = document.getElementById('topNav');
    if (!nav) return;
    let isAdmin = false;
    if (authToken()) {
        try {
            const r = await fetch('/api/v1/auth/status', { headers: { 'Authorization': 'Bearer ' + authToken() }});
            if (r.ok) {
                const d = await r.json();
                isAdmin = (d.role === 'admin');
            } else if (r.status === 401) {
                localStorage.removeItem('auth_token');
            }
        } catch (e) {}
    }
    isAdminUser = isAdmin;
    // The buttons may have already been laid out by route() before the role
    // check resolved. Re-apply visibility now that we know the answer.
    refreshEditButtons();
    // Keep in sync with renderNav() in dashboard.html. group:'admin' items
    // collapse into the Admin dropdown on desktop and an Admin section in
    // the mobile sidebar drawer.
    const items = [
        { label: 'Documentation', href: '/docs', active: true,           show: true },
        { label: 'My Licenses',   href: '/#/mylicenses', active: false,  show: !!authToken() && !isAdmin },
        { label: 'Workspaces',    href: '/#/workspaces', active: false,  show: !!authToken() },
        { label: 'Releases',      href: '/#/releases',   active: false,  show: !!authToken() },
        { label: 'Licenses',      href: '/#/licenses',   active: false,  show: !!authToken() && isAdmin },
        { label: 'Users',         href: '/#/users',      active: false,  show: !!authToken() && isAdmin },
        { label: 'Products',      href: '/#/products',   active: false,  show: !!authToken() && isAdmin, group: 'admin' },
        { label: 'Website',       href: '/#/website',    active: false,  show: !!authToken() && isAdmin, group: 'admin' },
        { label: 'Shop',          href: '/#/shop',       active: false,  show: !!authToken() && isAdmin, group: 'admin' },
        { label: 'Audit',         href: '/#/audit',      active: false,  show: !!authToken() && isAdmin, group: 'admin' },
        { label: 'Backups',       href: '/#/backups',    active: false,  show: !!authToken() && isAdmin, group: 'admin' },
    ];
    const visible = items.filter(i => i.show);
    docNavFlat = visible.filter(i => !i.group);
    docNavAdmin = visible.filter(i => i.group === 'admin');
    layoutDocsNav();
    // Mobile: the same links live in the collapsed "Susi Server" accordion
    // at the top of the sidebar drawer.
    const siteNav = document.getElementById('siteNavLinks');
    if (siteNav) {
        siteNav.innerHTML = docNavFlat.map(docNavPlain).join('') +
            (docNavAdmin.length ? '<div class="site-nav-label">Admin</div>' + docNavAdmin.map(docNavPlain).join('') : '');
    }
    document.getElementById('navLoginBtn').style.display = authToken() ? 'none' : '';
    document.getElementById('navLogoutBtn').style.display = authToken() ? '' : 'none';
}

// Priority+ top nav (keep in sync with layoutTopNav() in dashboard.html):
// flat items that don't fit the header width collapse into the trailing
// dropdown, labelled "Admin" while it only holds the admin group and "More"
// once flat items overflow into it.
let docNavFlat = [], docNavAdmin = [];
const docNavLink = i => '<a href="' + i.href + '"' + (i.active ? ' class="active"' : '') + '>' + i.label + '</a>';
const docNavPlain = i => '<a href="' + i.href + '">' + i.label + '</a>';

function renderDocsNavHtml(n) {
    const shown = docNavFlat.slice(0, n);
    const overflow = docNavFlat.slice(n);
    let html = shown.map(docNavLink).join('');
    if (overflow.length || docNavAdmin.length) {
        const label = overflow.length ? 'More' : 'Admin';
        const divider = (overflow.length && docNavAdmin.length) ? '<div class="menu-divider"></div>' : '';
        html += '<span class="nav-group">' +
            '<button type="button" onclick="toggleNavGroup(event)">' + label + ' &#9662;</button>' +
            '<div id="navAdminMenu" class="nav-group-menu">' +
            overflow.map(docNavLink).join('') + divider + docNavAdmin.map(docNavPlain).join('') + '</div></span>';
    }
    document.getElementById('topNav').innerHTML = html;
}

function layoutDocsNav() {
    const header = document.querySelector('.header');
    if (!header || !document.getElementById('topNav')) return;
    for (let n = docNavFlat.length; n >= 0; n--) {
        renderDocsNavHtml(n);
        if (header.scrollWidth <= header.clientWidth) break;
    }
}

let docNavResizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(docNavResizeTimer);
    docNavResizeTimer = setTimeout(layoutDocsNav, 120);
});

function toggleNavGroup(event) {
    event.stopPropagation();
    const m = document.getElementById('navAdminMenu');
    if (m) m.classList.toggle('open');
}

function toggleDocsMore(event) {
    event.stopPropagation();
    document.getElementById('docsMoreMenu').classList.toggle('open');
}

function toggleSiteNav() {
    document.getElementById('siteNavMobile').classList.toggle('open');
}

document.addEventListener('click', () => {
    ['navAdminMenu', 'docsMoreMenu'].forEach(id => {
        const m = document.getElementById(id);
        if (m) m.classList.remove('open');
    });
});

// Responsive header control relocation. Below 1150px the edit/login buttons
// move into the header kebab menu; below 720px the pickers additionally move
// into the sidebar drawer. Elements are DOM-moved (not duplicated) so all
// existing visibility logic keeps working on them.
const docsMobileMq = window.matchMedia('(max-width: 720px)');
const docsMidMq = window.matchMedia('(max-width: 1150px)');
function relocateHeaderControls() {
    const headerRight = document.querySelector('.header-right');
    const theme = document.getElementById('btnTheme');
    const pickers = ['productPicker', 'releasePicker'].map(id => document.getElementById(id));
    const actions = ['newVersionBtn', 'editBtn', 'newPageBtn', 'navLoginBtn', 'navLogoutBtn']
        .map(id => document.getElementById(id));
    if (docsMobileMq.matches) {
        const pickerSlot = document.getElementById('drawerPickers');
        pickers.forEach(el => pickerSlot.appendChild(el));
    } else {
        pickers.forEach(el => headerRight.insertBefore(el, theme));
    }
    if (docsMidMq.matches) {
        const menu = document.getElementById('docsMoreMenu');
        actions.forEach(el => menu.appendChild(el));
    } else {
        actions.slice(0, 3).forEach(el => headerRight.insertBefore(el, theme));
        actions.slice(3).forEach(el => headerRight.appendChild(el));
    }
    layoutDocsNav();
}
relocateHeaderControls();
docsMobileMq.addEventListener('change', relocateHeaderControls);
docsMidMq.addEventListener('change', relocateHeaderControls);

function logoutFromDocs() {
    localStorage.removeItem('auth_token');
    location.href = '/';
}

// Build the nav once on load.
renderTopNav();

// In workspace mode, show the workspace name in the header.
if (currentWorkspaceId) {
    (async () => {
        try {
            const r = await fetch(API + '/workspaces/' + encodeURIComponent(currentWorkspaceId), {
                headers: docHeaders(),
            });
            if (r.ok) {
                const d = await r.json();
                currentWorkspaceName = d.name || currentWorkspaceId;
                const el = document.getElementById('wsBanner');
                document.getElementById('wsBannerName').textContent = currentWorkspaceName;
                el.style.display = '';
                const dn = document.getElementById('drawerWsName');
                dn.textContent = 'Workspace: ' + currentWorkspaceName;
                dn.style.display = '';
                // The workspace endpoint only answers for members and site
                // admins, so a 200 here means this user may author docs.
                isWorkspaceEditor = true;
                refreshEditButtons();
            }
        } catch (e) {}
    })();
}

function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast visible' + (kind ? ' ' + kind : '');
    setTimeout(() => el.classList.remove('visible'), 2400);
}

function escHtml(s) {
    return (s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ---------------------------------------------------------------------------
// Markdown renderer — handles what generate_node_docs.py emits:
// ATX headers, fenced code blocks, inline code, bold/italic, links, images,
// blockquotes, unordered lists, GFM tables, horizontal rules, hard line breaks.
// ---------------------------------------------------------------------------

function videoEmbedSrc(url) {
    let m = url.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)(?:\/([a-f0-9]+))?/);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] ? '?h=' + m[2] : '');
    m = url.match(/^https?:\/\/player\.vimeo\.com\/video\/\d+/);
    if (m) return url;
    m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = url.match(/^https?:\/\/youtu\.be\/([A-Za-z0-9_-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/embed\/[A-Za-z0-9_-]+/);
    if (m) return url;
    return null;
}

function renderInline(s) {
    let out = escHtml(s);
    // Code spans first to avoid further substitution inside them.
    out = out.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
    // Images ![alt](url) with optional Pandoc-style {width=N height=M} attributes.
    // A Vimeo/YouTube url renders as a responsive video embed instead.
    out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)(\{[^}]*\})?/g, (_, alt, url, attrs) => {
        const vsrc = videoEmbedSrc(url);
        if (vsrc) {
            return '<div class="video-embed"><iframe src="' + vsrc
                + '" title="' + alt
                + '" allow="autoplay; fullscreen; picture-in-picture"'
                + ' allowfullscreen loading="lazy"></iframe></div>';
        }
        let extra = '';
        if (attrs) {
            const w = attrs.match(/\bwidth\s*=\s*(\d+(?:px|%)?)/i);
            const h = attrs.match(/\bheight\s*=\s*(\d+(?:px|%)?)/i);
            if (w) extra += ' width="' + w[1] + '"';
            if (h) extra += ' height="' + h[1] + '"';
        }
        return '<img alt="' + alt + '" src="' + resolveAssetUrl(url) + '"' + extra + '>';
    });
    // Links [text](url)
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
        const safe = url.startsWith('http') || url.startsWith('#') || url.startsWith('/')
            ? url : '#/' + currentTag + '/' + url;
        return '<a href="' + safe + '">' + text + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return out;
}

function resolveAssetUrl(url) {
    if (url.startsWith('http') || url.startsWith('/') || url.startsWith('data:')) return url;
    if (!currentTag) return url;
    let assetUrl = docBase() + '/' + encodeURIComponent(currentTag) + '/assets/' + encodeURIComponent(url);
    // Workspace-scoped doc reads require auth, but browser <img> requests don't
    // send the Authorization header. Pass the JWT via query string for these.
    if (currentWorkspaceId && authToken()) {
        assetUrl += '?auth=' + encodeURIComponent(authToken());
    }
    return assetUrl;
}

function renderMarkdown(src) {
    if (!src) return '';
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
        const line = lines[i];

        // Fenced code block
        const fence = line.match(/^```(.*)$/);
        if (fence) {
            const lang = fence[1].trim();
            const buf = [];
            i++;
            while (i < lines.length && !lines[i].match(/^```\s*$/)) {
                buf.push(lines[i]); i++;
            }
            i++;
            out.push('<pre><code' + (lang ? ' class="lang-' + escHtml(lang) + '"' : '') + '>'
                + escHtml(buf.join('\n')) + '</code></pre>');
            continue;
        }

        // Inline table-of-contents marker on its own line: [TOC] / [[TOC]] / [[_TOC_]]
        if (/^\[\[?_?toc_?\]?\]$/i.test(line.trim())) {
            out.push('<nav class="doc-toc" data-doc-toc></nav>');
            i++;
            continue;
        }

        // ATX header
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) {
            const level = h[1].length;
            out.push('<h' + level + '>' + renderInline(h[2]) + '</h' + level + '>');
            i++;
            continue;
        }

        // Horizontal rule
        if (/^---+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

        // Blockquote
        if (line.startsWith('> ')) {
            const buf = [];
            while (i < lines.length && lines[i].startsWith('> ')) {
                buf.push(lines[i].slice(2)); i++;
            }
            out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
            continue;
        }

        // GFM table — header row, alignment row, then body rows
        if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]+\|?\s*$/.test(lines[i+1])) {
            const headers = splitTableRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
                rows.push(splitTableRow(lines[i])); i++;
            }
            // Table cells may stack lines with literal <br> (cells only, not
            // body text). If every stacked line is a "- " item, render a list.
            const cellInline = s => {
                const parts = s.split(/<br\s*\/?>/i);
                if (parts.length > 1 && parts.every(p => p.trim().startsWith('- '))) {
                    return '<ul class="cell-list">'
                        + parts.map(p => '<li>' + renderInline(p.trim().slice(2)) + '</li>').join('')
                        + '</ul>';
                }
                return renderInline(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
            };
            // Two-column image galleries (header "Image"/"Product Image") get
            // fixed column proportions so a width=100% image can't blow up
            // its column.
            const isGallery = headers.length === 2 && /^\**(product )?image\**$/i.test(headers[0].trim());
            let html = '<div class="table-scroll"><table' + (isGallery ? ' class="gallery-table"' : '') + '>';
            if (isGallery) html += '<colgroup><col style="width:40%"><col></colgroup>';
            html += '<thead><tr>';
            headers.forEach(h => html += '<th>' + cellInline(h) + '</th>');
            html += '</tr></thead><tbody>';
            rows.forEach(r => {
                html += '<tr>';
                r.forEach(c => html += '<td>' + cellInline(c) + '</td>');
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            out.push(html);
            continue;
        }

        // Unordered list
        if (/^[-*]\s+/.test(line)) {
            const buf = [];
            while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
                buf.push(lines[i].replace(/^[-*]\s+/, '')); i++;
            }
            out.push('<ul>' + buf.map(b => '<li>' + renderInline(b) + '</li>').join('') + '</ul>');
            continue;
        }

        // Ordered list — preserve the first item's number as the list start
        const ol = line.match(/^(\d+)\.\s+(.*)$/);
        if (ol) {
            const start = ol[1];
            const buf = [ol[2]];
            i++;
            while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
                buf.push(lines[i].replace(/^\d+\.\s+/, '')); i++;
            }
            const startAttr = start === '1' ? '' : ' start="' + start + '"';
            out.push('<ol' + startAttr + '>' + buf.map(b => '<li>' + renderInline(b) + '</li>').join('') + '</ol>');
            continue;
        }

        // Paragraph: collect contiguous non-blank lines
        if (line.trim() === '') { i++; continue; }
        const para = [line];
        i++;
        while (i < lines.length && lines[i].trim() !== ''
               && !/^(#{1,6}\s|```|>|---+\s*$|[-*]\s|\d+\.\s)/.test(lines[i])
               && !(lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[i+1]))) {
            para.push(lines[i]); i++;
        }
        out.push('<p>' + renderInline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
}

function splitTableRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|')) s = s.slice(0, -1);
    // Split on unescaped pipes
    const cells = [];
    let cur = '';
    for (let j = 0; j < s.length; j++) {
        if (s[j] === '\\' && j + 1 < s.length && s[j+1] === '|') { cur += '|'; j++; }
        else if (s[j] === '|') { cells.push(cur.trim()); cur = ''; }
        else cur += s[j];
    }
    cells.push(cur.trim());
    return cells;
}

// Load the product catalog and populate the picker. Global mode only —
// workspace docs are not product-scoped.
async function loadProducts() {
    if (currentWorkspaceId) return;
    try {
        const resp = await fetch(API + '/products', { headers: docHeaders() });
        if (!resp.ok) return;
        const data = await resp.json();
        products = data.products || [];
    } catch (e) { return; }
    const picker = document.getElementById('productPicker');
    if (!picker || products.length === 0) return;
    if (!products.some(p => p.slug === currentProduct)) currentProduct = products[0].slug;
    picker.innerHTML = products.map(p =>
        '<option value="' + escHtml(p.slug) + '">' + escHtml(p.name || p.slug) + '</option>'
    ).join('');
    picker.value = currentProduct;
    picker.style.display = '';
    syncProductInUrl();
}

async function onProductChanged() {
    currentProduct = document.getElementById('productPicker').value;
    syncProductInUrl();
    releases = []; currentTag = null; currentSlug = null;
    if (location.hash) { location.hash = ''; } else { route(); }
}

async function loadReleases() {
    const url = currentWorkspaceId
        ? API + '/workspaces/' + encodeURIComponent(currentWorkspaceId) + '/docs/releases'
        : API + '/products/' + encodeURIComponent(currentProduct) + '/docs/releases';
    const resp = await fetch(url, { headers: docHeaders() });
    // null = fetch denied/failed (error state already rendered), so route()
    // won't overwrite it with the "no releases yet" hint.
    if (!resp.ok) {
        renderEmptyState(currentWorkspaceId
            ? 'Could not load workspace documentation. Are you signed in as a workspace member?'
            : 'Could not load documentation index.');
        return null;
    }
    const data = await resp.json();
    releases = data.releases || [];
    const picker = document.getElementById('releasePicker');
    picker.innerHTML = releases.map(r =>
        '<option value="' + escHtml(r.tag) + '">' + escHtml(r.tag) + (r.name && r.name !== r.tag ? ' — ' + escHtml(r.name) : '') + '</option>'
    ).join('');
    return releases.length > 0;
}

async function loadRelease(tag) {
    currentTag = tag;
    document.getElementById('releasePicker').value = tag;
    const resp = await fetch(docBase() + '/' + encodeURIComponent(tag) + '/pages', { headers: docHeaders() });
    if (!resp.ok) {
        renderEmptyState('Release "' + tag + '" not found.');
        return;
    }
    const data = await resp.json();
    pages = data.pages || [];
    assets = data.assets || [];
    renderSidebar();
}

async function loadPage(slug) {
    if (!currentTag) return;
    currentSlug = slug;
    const resp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/pages/' + encodeURIComponent(slug), { headers: docHeaders() });
    if (!resp.ok) {
        currentPage = null;
        renderEmptyState('Page "' + slug + '" not found in this release.');
        return;
    }
    currentPage = await resp.json();
    editMode = false;
    if (easymde) { try { easymde.toTextArea(); } catch (e) {} easymde = null; }
    renderSidebar();
    renderPage();
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function renderSidebar() {
    const sb = document.getElementById('sidebarTree');
    if (pages.length === 0) {
        sb.innerHTML = '<div class="empty">No pages yet.</div>';
        return;
    }
    // Group by parent_slug. Pages with no parent are top-level.
    const byParent = new Map();
    const topLevel = [];
    const slugSet = new Set(pages.map(p => p.slug));
    pages.forEach(p => {
        if (p.parent_slug && slugSet.has(p.parent_slug)) {
            if (!byParent.has(p.parent_slug)) byParent.set(p.parent_slug, []);
            byParent.get(p.parent_slug).push(p);
        } else {
            topLevel.push(p);
        }
    });
    topLevel.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
    let html = '';
    topLevel.forEach(p => {
        html += renderSidebarItem(p, true);
        const children = byParent.get(p.slug) || [];
        children.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
        children.forEach(c => html += renderSidebarItem(c, false));
    });
    // Orphans (parent_slug set but no matching parent): show under their named group label
    const orphans = pages.filter(p => p.parent_slug && !slugSet.has(p.parent_slug));
    if (orphans.length) {
        const groups = new Map();
        orphans.forEach(o => {
            if (!groups.has(o.parent_slug)) groups.set(o.parent_slug, []);
            groups.get(o.parent_slug).push(o);
        });
        for (const [g, items] of groups) {
            html += '<h3>' + escHtml(g) + '</h3>';
            items.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
            items.forEach(it => html += renderSidebarItem(it, false));
        }
    }
    sb.innerHTML = html;
}

function renderSidebarItem(p, isHead) {
    const cls = (p.slug === currentSlug ? 'active' : '') + (isHead ? ' section-head' : '');
    return '<a class="' + cls + '" href="#/' + escHtml(currentTag) + '/' + escHtml(p.slug) + '">' + escHtml(p.title) + '</a>';
}

function renderEmptyState(msg) {
    document.getElementById('content').innerHTML =
        '<div class="empty-state"><h2>' + escHtml(msg) + '</h2></div>';
}

function renderPage() {
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    if (!currentPage) {
        renderEmptyState('Select a page from the sidebar.');
        document.getElementById('editBtn').style.display = 'none';
        if (layout) layout.classList.add('no-toc');
        return;
    }
    document.getElementById('editBtn').style.display = canEditDocs() ? '' : 'none';
    document.getElementById('newPageBtn').style.display = canEditDocs() ? '' : 'none';
    if (editMode) {
        if (layout) layout.classList.add('no-toc');
        renderEditor();
        return;
    }
    // Workspace docs are often standalone collections (handbooks, guides)
    // where a "Release <tag>" prefix would be confusing noise.
    const meta = '<div class="meta">'
        + (currentWorkspaceId ? '' : 'Release <code>' + escHtml(currentTag) + '</code> · ')
        + 'Updated ' + escHtml(formatDate(currentPage.updated_at)) + '</div>';
    let html = meta + renderMarkdown(currentPage.body_md || '');
    const { html: withIds, headings } = injectHeadingIds(html);
    c.innerHTML = withIds;
    populateInlineToc(c, headings);
    wireContentAnchors(c);
    renderToc(headings);
}

// In-content same-page anchor links ("#heading-id"): scroll instead of letting
// the hash router misread the fragment as a release tag.
function wireContentAnchors(container) {
    container.querySelectorAll('a[href^="#"]:not([data-toc-id])').forEach(a => {
        const href = a.getAttribute('href');
        if (href.startsWith('#/')) return; // real route
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const el = document.getElementById(decodeURIComponent(href.slice(1)));
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });
}

// Fill any inline [TOC] placeholders with H2/H3 links derived from the page's
// own heading ids (assigned by injectHeadingIds), wired to scroll-into-view so
// they don't disturb the hash router.
function populateInlineToc(container, headings) {
    const hosts = container.querySelectorAll('nav.doc-toc[data-doc-toc]');
    if (!hosts.length) return;
    const items = headings.filter(h => h.level >= 2 && h.level <= 3);
    hosts.forEach(host => {
        if (!items.length) { host.remove(); return; }
        const links = items.map(h =>
            '<a class="doc-toc-lvl-' + h.level + '" href="#' + h.id + '" data-toc-id="' + h.id + '">' + escHtml(h.text) + '</a>'
        ).join('');
        host.innerHTML = '<div class="doc-toc-title">Contents</div>' + links;
        host.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const el = document.getElementById(a.getAttribute('data-toc-id'));
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });
    });
}

// ---------------------------------------------------------------------------
// Table of contents
// ---------------------------------------------------------------------------

function injectHeadingIds(html) {
    // Match h1..h4 with no existing id; assign a slug derived from the text content.
    const used = new Map(); // base slug -> count
    const headings = [];
    function slugify(text) {
        const base = text.toLowerCase()
            .replace(/<[^>]+>/g, '')
            .replace(/&[a-z]+;/g, ' ')
            .replace(/[^\p{L}\p{N}]+/gu, '-')
            .replace(/^-+|-+$/g, '')
            || 'section';
        const n = used.get(base) || 0;
        used.set(base, n + 1);
        return n === 0 ? base : base + '-' + n;
    }
    const out = html.replace(/<h([1-4])(?![^>]*\bid=)([^>]*)>([\s\S]*?)<\/h\1>/g,
        (_m, lvl, attrs, inner) => {
            const level = parseInt(lvl, 10);
            const text = inner.replace(/<[^>]+>/g, '').trim();
            if (!text) return _m;
            const id = slugify(text);
            headings.push({ level, text, id });
            return '<h' + lvl + attrs + ' id="' + id + '">' + inner + '</h' + lvl + '>';
        });
    return { html: out, headings };
}

let tocActiveObserver = null;

function renderToc(headings) {
    const rail = document.getElementById('tocRail');
    const layout = document.getElementById('layout');
    if (!rail) return;
    if (tocActiveObserver) { tocActiveObserver.disconnect(); tocActiveObserver = null; }

    // Skip the first H1 if it's the page title (matches currentPage.title).
    let items = headings.slice();
    if (items.length && items[0].level === 1 && currentPage
        && items[0].text.toLowerCase() === (currentPage.title || '').toLowerCase()) {
        items = items.slice(1);
    }
    // Drop the rail entirely if there's nothing meaningful to show.
    if (items.length < 2) {
        rail.innerHTML = '';
        if (layout) layout.classList.add('no-toc');
        return;
    }
    if (layout) layout.classList.remove('no-toc');

    const links = items.map(h => {
        const cls = 'lvl-' + h.level;
        return '<a class="' + cls + '" href="#' + h.id + '" data-toc-id="' + h.id + '">' + escHtml(h.text) + '</a>';
    }).join('');
    rail.innerHTML = '<div class="toc-title">On this page</div>' + links;

    // Override default anchor behavior to scroll into view (the URL has hash routing).
    rail.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const id = a.getAttribute('data-toc-id');
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });

    // Scroll-spy: highlight the link whose heading is closest to the top.
    const observed = items.map(h => document.getElementById(h.id)).filter(Boolean);
    const linkById = new Map();
    rail.querySelectorAll('a').forEach(a => linkById.set(a.getAttribute('data-toc-id'), a));
    const setActive = (id) => {
        rail.querySelectorAll('a.active').forEach(a => a.classList.remove('active'));
        const a = linkById.get(id);
        if (a) a.classList.add('active');
    };
    tocActiveObserver = new IntersectionObserver((entries) => {
        const visible = entries
            .filter(e => e.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-72px 0px -60% 0px', threshold: 0 });
    observed.forEach(el => tocActiveObserver.observe(el));
    if (observed[0]) setActive(observed[0].id);
}

let easymde = null; // current editor instance

function renderEditor() {
    const c = document.getElementById('content');
    const title = currentPage.title || '';
    const parent = currentPage.parent_slug || '';
    const ord = currentPage.ord || 0;
    const body = currentPage.body_md || '';
    const parentOptions = buildParentOptions(parent, currentSlug);
    c.innerHTML =
        '<div class="edit-meta-row">' +
            '<label>Title</label><input id="editTitle" type="text" style="flex:1;min-width:200px;">' +
            '<label>Slug</label><input id="editSlug" type="text" style="width:160px;">' +
            '<label>Parent</label><select id="editParent" style="min-width:200px;">' + parentOptions + '</select>' +
            '<label>Order</label><input id="editOrd" type="number" style="width:80px;">' +
        '</div>' +
        '<textarea id="editBody"></textarea>' +
        '<div class="edit-actions">' +
            '<button class="btn primary" onclick="savePage()">Save</button>' +
            '<button class="btn" onclick="cancelEdit()">Cancel</button>' +
            '<div style="flex:1"></div>' +
            '<button class="btn danger" onclick="deletePage()">Delete page</button>' +
        '</div>';
    document.getElementById('editTitle').value = title;
    document.getElementById('editSlug').value = currentSlug;
    document.getElementById('editOrd').value = ord;
    initEasyMDE(body);
}

/// Build <option> list for the parent dropdown: "(none)" + every page except
/// the current one. Includes the existing parent_slug as a free-form option
/// when it points at a page that doesn't (yet) exist, so we don't silently
/// lose the value.
function buildParentOptions(selected, excludeSlug) {
    const opts = ['<option value="">(none — top level)</option>'];
    const sorted = [...pages].sort((a, b) => a.title.localeCompare(b.title));
    const known = new Set();
    sorted.forEach(p => {
        if (p.slug === excludeSlug) return;
        known.add(p.slug);
        const sel = p.slug === selected ? ' selected' : '';
        opts.push('<option value="' + escHtml(p.slug) + '"' + sel + '>'
            + escHtml(p.title) + ' (' + escHtml(p.slug) + ')</option>');
    });
    if (selected && !known.has(selected)) {
        opts.push('<option value="' + escHtml(selected) + '" selected>'
            + escHtml(selected) + ' (orphan)</option>');
    }
    return opts.join('');
}

function initEasyMDE(initialBody) {
    if (typeof EasyMDE === 'undefined') {
        toast('Editor failed to load — refresh the page', 'error');
        return;
    }
    if (easymde) { try { easymde.toTextArea(); } catch (e) {} easymde = null; }

    easymde = new EasyMDE({
        element: document.getElementById('editBody'),
        initialValue: initialBody,
        autofocus: true,
        spellChecker: false,
        autoDownloadFontAwesome: false,
        status: ['lines', 'words'],
        uploadImage: true,
        imageUploadFunction: easymdeImageUpload,
        imageMaxSize: 100 * 1024 * 1024,
        imageAccept: 'image/*',
        imageTexts: {
            sbInit: 'Attach images by drag-and-drop, paste, or the upload button.',
            sbOnDrop: 'Uploading #images_names#…',
            sbProgress: 'Uploading #file_name#: #progress#%',
            sbOnUploaded: 'Uploaded #image_name#',
            sizeUnits: ' B, KB, MB',
        },
        previewRender: easymdePreviewRender,
        renderingConfig: { singleLineBreaks: false, codeSyntaxHighlighting: false },
        toolbar: [
            { name: 'bold', action: EasyMDE.toggleBold, text: 'B', title: 'Bold' },
            { name: 'italic', action: EasyMDE.toggleItalic, text: 'I', title: 'Italic' },
            { name: 'heading', action: EasyMDE.toggleHeadingSmaller, text: 'H', title: 'Heading' },
            '|',
            { name: 'quote', action: EasyMDE.toggleBlockquote, text: '❝', title: 'Quote' },
            { name: 'code', action: EasyMDE.toggleCodeBlock, text: '</>', title: 'Code block' },
            { name: 'unordered-list', action: EasyMDE.toggleUnorderedList, text: '•', title: 'Bulleted list' },
            { name: 'ordered-list', action: EasyMDE.toggleOrderedList, text: '1.', title: 'Numbered list' },
            { name: 'table', action: EasyMDE.drawTable, text: '⊞', title: 'Insert table' },
            '|',
            { name: 'link', action: EasyMDE.drawLink, text: '🔗', title: 'Insert link' },
            { name: 'upload-image', action: '*image-upload*', text: '🖼', title: 'Upload image' },
            { name: 'horizontal-rule', action: EasyMDE.drawHorizontalRule, text: '—', title: 'Horizontal rule' },
            '|',
            { name: 'preview', action: EasyMDE.togglePreview, text: '👁', title: 'Toggle preview', noDisable: true },
        ],
    });
}

/// Render preview using the same renderer as the published view so previews
/// match exactly (including {width=N height=M} image attributes).
function easymdePreviewRender(plainText) {
    return renderMarkdown(plainText);
}

/// EasyMDE-compatible image uploader.
/// Signature: (file, onSuccess(url), onError(msg))
async function easymdeImageUpload(file, onSuccess, onError) {
    if (!canEditDocs()) { onError('Login required'); return; }
    if (!currentTag) { onError('No release selected'); return; }
    const name = generateAssetName(file);
    try {
        const fd = new FormData();
        fd.append('file', file, name);
        const resp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/assets', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + authToken() },
            body: fd,
        });
        if (resp.status === 401) {
            onError('Session expired');
            handleSessionExpired(easymde ? easymde.value() : '');
            return;
        }
        if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            onError(d.error || ('HTTP ' + resp.status));
            return;
        }
        const data = await resp.json();
        // EasyMDE inserts ![alt](onSuccess-arg) — we pass the bare filename so the
        // markdown stays portable; previewRender resolves it to the asset endpoint.
        onSuccess(data.name);
        toast('Uploaded ' + data.name, 'success');
    } catch (e) {
        onError(e.message);
    }
}

function inferExtension(file) {
    const m = (file.type || '').match(/^image\/(\w+)/);
    if (!m) return 'png';
    const ext = m[1].toLowerCase();
    return ext === 'jpeg' ? 'jpg' : ext;
}

function generateAssetName(file) {
    const orig = (file.name || '').replace(/[^A-Za-z0-9._-]/g, '_');
    // Browsers use a generic "image.png" filename for clipboard-pasted
    // images, which collides across pastes — always timestamp those.
    const isPasteDefault = /^image\.(png|jpe?g|gif|webp|svg)$/i.test(orig);
    if (orig && !isPasteDefault && /\.[A-Za-z0-9]+$/.test(orig)) return orig;
    const ts = new Date().toISOString().replace(/[:.]/g, '-').replace(/Z$/, '');
    return 'image-' + ts + '.' + inferExtension(file);
}

function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString();
}

// ---------------------------------------------------------------------------
// Edit actions
// ---------------------------------------------------------------------------

function enterEditMode() {
    if (!currentPage) return;
    if (!canEditDocs()) { toast('Login required', 'error'); return; }
    editMode = true;
    renderPage();
}

function cancelEdit() {
    if (easymde) { try { easymde.toTextArea(); } catch (e) {} easymde = null; }
    editMode = false;
    renderPage();
}

async function savePage() {
    const title = document.getElementById('editTitle').value.trim();
    const parent = document.getElementById('editParent').value.trim();
    const ord = parseInt(document.getElementById('editOrd').value, 10) || 0;
    const body_md = easymde ? easymde.value() : document.getElementById('editBody').value;
    const newSlug = document.getElementById('editSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
    if (!title) { toast('Title is required', 'error'); return; }
    if (!newSlug) { toast('Slug is required', 'error'); return; }

    let targetSlug = currentSlug;
    if (newSlug !== currentSlug) {
        const renameResp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/pages/' + encodeURIComponent(currentSlug) + '/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken() },
            body: JSON.stringify({ new_slug: newSlug }),
        });
        if (renameResp.status === 401) { handleSessionExpired(body_md); return; }
        if (!renameResp.ok) {
            const d = await renameResp.json().catch(() => ({}));
            toast('Rename failed: ' + (d.error || renameResp.status), 'error');
            return;
        }
        targetSlug = newSlug;
    }

    const resp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/pages/' + encodeURIComponent(targetSlug), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken() },
        body: JSON.stringify({ title, body_md, parent_slug: parent || null, ord }),
    });
    if (resp.status === 401) {
        handleSessionExpired(body_md);
        return;
    }
    if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        toast('Save failed: ' + (d.error || resp.status), 'error');
        return;
    }
    toast('Saved', 'success');
    editMode = false;
    if (targetSlug !== currentSlug) {
        location.hash = '#/' + currentTag + '/' + targetSlug;
    } else {
        await loadRelease(currentTag);
        await loadPage(currentSlug);
    }
}

/// Show a non-destructive prompt when a save/upload returns 401.
/// Offers to copy the unsaved markdown so the user can re-login without losing work.
function handleSessionExpired(currentBody) {
    localStorage.removeItem('auth_token');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;';
    overlay.innerHTML =
        '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:480px;color:var(--text1);">' +
            '<h2 style="margin:0 0 8px;font-size:16px;">Session expired</h2>' +
            '<p style="margin:0 0 14px;color:var(--text2);font-size:13px;">' +
                'Your login token is no longer valid (this can happen after a server restart). ' +
                'Your edits are still in this editor — copy them to the clipboard before logging in again so you don\'t lose them.' +
            '</p>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
                '<button class="btn" id="copyEdits">Copy edits to clipboard</button>' +
                '<button class="btn primary" id="reloginBtn">Log in again</button>' +
            '</div>' +
        '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#copyEdits').onclick = async () => {
        try {
            await navigator.clipboard.writeText(currentBody || '');
            toast('Copied to clipboard', 'success');
        } catch (e) {
            toast('Copy failed — select-all and copy manually', 'error');
        }
    };
    overlay.querySelector('#reloginBtn').onclick = () => {
        // Open the dashboard in a new tab so the user can log in without losing this editor.
        window.open('/', '_blank');
        overlay.remove();
        toast('Log in, then come back to this tab and click Save again.', 'success');
    };
}

async function deletePage() {
    if (!confirm('Delete page "' + currentPage.title + '"? This cannot be undone.')) return;
    const resp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/pages/' + encodeURIComponent(currentSlug), {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + authToken() },
    });
    if (!resp.ok) { toast('Delete failed', 'error'); return; }
    toast('Deleted', 'success');
    currentSlug = null; currentPage = null;
    await loadRelease(currentTag);
    location.hash = '#/' + currentTag;
}

async function newPage() {
    if (!canEditDocs()) { toast('Login required', 'error'); return; }
    const slug = prompt('New page slug (lowercase, no spaces):');
    if (!slug) return;
    const cleanSlug = slug.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
    if (!cleanSlug) { toast('Invalid slug', 'error'); return; }
    const title = prompt('Page title:', cleanSlug) || cleanSlug;
    const resp = await fetch(docBase() + '/' + encodeURIComponent(currentTag) + '/pages/' + encodeURIComponent(cleanSlug), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken() },
        body: JSON.stringify({ title, body_md: '# ' + title + '\n\n', parent_slug: null, ord: 999 }),
    });
    if (!resp.ok) {
        let msg = 'Create failed (HTTP ' + resp.status + ')';
        try { const d = await resp.json(); if (d && d.error) msg = d.error; } catch (_) {}
        toast(msg, 'error');
        return;
    }
    // The release row is created lazily on the first page save, so refresh the
    // release list to pick up a brand-new version, then reload the release so
    // the new page shows up in the sidebar before navigating.
    if (!releases.some(r => r.tag === currentTag)) {
        await loadReleases();
        document.getElementById('releasePicker').value = currentTag;
    }
    await loadRelease(currentTag);
    location.hash = '#/' + currentTag + '/' + cleanSlug;
}

// Start authoring a fresh version for the current product. The release row is
// created on the backend when the first page is saved (ensure_release_with_seed),
// so here we just point the editor at the new tag with an empty sidebar.
async function newVersion() {
    if (!canEditDocs()) { toast('Login required', 'error'); return; }
    const tag = prompt('New version tag (e.g. v1.0):');
    if (!tag) return;
    const cleanTag = tag.trim();
    if (!cleanTag) { toast('Invalid version', 'error'); return; }
    if (releases.some(r => r.tag === cleanTag)) {
        // Already exists — just switch to it.
        location.hash = '#/' + cleanTag;
        return;
    }
    currentTag = cleanTag;
    pages = []; assets = []; currentSlug = null; currentPage = null;
    const picker = document.getElementById('releasePicker');
    const opt = document.createElement('option');
    opt.value = cleanTag; opt.textContent = cleanTag;
    picker.appendChild(opt);
    picker.value = cleanTag;
    renderSidebar();
    document.getElementById('newPageBtn').style.display = '';
    document.getElementById('editBtn').style.display = 'none';
    renderEmptyState('New version "' + cleanTag + '" - click + Page to add the first page.');
}

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

function onReleaseChanged() {
    const tag = document.getElementById('releasePicker').value;
    location.hash = '#/' + tag;
}

async function route() {
    const hash = location.hash.replace(/^#\/?/, '');
    const parts = hash.split('/').filter(Boolean).map(decodeURIComponent);
    if (!currentWorkspaceId && products.length === 0) await loadProducts();
    if (releases.length === 0) {
        const ok = await loadReleases();
        if (!ok) {
            // No releases for this product/workspace — clear any pages left over
            // from a previously selected product so the sidebar doesn't lie.
            pages = []; assets = []; currentTag = null; currentSlug = null; currentPage = null;
            renderSidebar();
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('newPageBtn').style.display = 'none';
            if (ok !== null) {
                renderEmptyState(currentWorkspaceId
                    ? 'No documentation releases in this workspace yet. Create one from the Workspaces page.'
                    : 'No documentation has been published yet.');
            }
            return;
        }
    }
    // Hash takes precedence; otherwise use ?tag= (one-shot, only on first load)
    // and fall back to the first release in the listing.
    const tag = parts[0] || (initialTagParam && releases.some(r => r.tag === initialTagParam) ? initialTagParam : releases[0].tag);
    if (tag !== currentTag) await loadRelease(tag);
    if (pages.length === 0) {
        // Empty release: still surface the "+ Page" button for logged-in users
        // so they can create the first page. Otherwise newly-created workspace
        // releases would have no entry point.
        document.getElementById('content').innerHTML = '<div class="empty-state"><h2>No pages in this release</h2><p style="color:var(--text2);margin-top:8px;">Click <strong>+ Page</strong> to create the first one.</p></div>';
        document.getElementById('newPageBtn').style.display = canEditDocs() ? '' : 'none';
        document.getElementById('editBtn').style.display = 'none';
        return;
    }
    const slug = parts[1];
    if (slug) {
        await loadPage(slug);
    } else {
        // Default: first top-level page
        const sorted = [...pages].sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
        const first = sorted.find(p => !p.parent_slug) || sorted[0];
        location.hash = '#/' + tag + '/' + first.slug;
    }
}

window.addEventListener('hashchange', route);
route();
</script>
