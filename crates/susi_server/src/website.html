// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

// Path-based routing with legacy hash backcompat. On the canonical public
// domain (xikaku.com) URLs are /{slug}; on susi.lp-research.com they're
// /site/{slug}. If a visitor lands on /site#/foo we transparently upgrade to
// the canonical path form via replaceState so crawlers and shared links
// resolve cleanly.
function slugFromLocation() {
    let path = location.pathname || '';
    // A translated render sees the same URL space one /{lang}/ segment
    // deeper; strip the prefix (after the optional /site) before matching.
    if (LANG) {
        path = path.replace(new RegExp('^(\\/site)?\\/' + LANG + '(?=\\/|$)'), '$1');
        if (path === '' || path === '/site') return '';
    }
    // Blog posts: /blog/{slug} (clean) or /site/blog/{slug} (legacy host).
    const post = path.match(/^(?:\/site)?\/blog\/([^\/\?#]+)$/);
    if (post) return decodeURIComponent(post[1]);
    // Always recognize legacy /site/{slug} so old links keep working.
    const legacy = path.match(/^\/site\/([^\/\?#]+)/);
    if (legacy) return decodeURIComponent(legacy[1]);
    // Clean URL form on the canonical host: /{slug} where slug isn't reserved.
    if (SITE_PATH_PREFIX === '') {
        const m = path.match(/^\/([^\/\?#]+)$/);
        if (m && !RESERVED_TOP_PATHS.has(m[1])) return decodeURIComponent(m[1]);
    }
    // Only the legacy #/foo form routes to a page; a plain #foo is an
    // in-page anchor (see anchorFromLocation).
    const legacyHash = location.hash.match(/^#\/(.+)/);
    if (legacyHash) return decodeURIComponent(legacyHash[1].split('/').filter(Boolean)[0] || '');
    return '';
}

function anchorFromLocation() {
    if (!location.hash || location.hash.startsWith('#/')) return '';
    return decodeURIComponent(location.hash.slice(1));
}

function scrollToAnchor(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
}

// The bg theme scrolls inside #pageScroll instead of the window.
function resetScroll() {
    window.scrollTo(0, 0);
    const ps = document.getElementById('pageScroll');
    if (ps) ps.scrollTop = 0;
}

function navigateTo(slug) {
    const target = (slug ? pageHref(slug) : siteRootHref()) + adClickQuery();
    if (location.pathname + location.search !== target) {
        history.pushState({}, '', target);
    }
    if (location.hash) {
        history.replaceState({}, '', target);
    }
    route().then(resetScroll);
}

async function route() {
    // Shop routes are handled by a separate render path that reuses the
    // same chrome (header, sidebar, drawer) but renders product views.
    const shopRoute = shopRouteFromLocation();
    if (shopRoute) {
        await Promise.all([loadIndex(), loadShopProducts()]);
        if (shopRoute.kind === 'grid')    renderShopGrid();
        if (shopRoute.kind === 'detail')  renderShopDetail(shopRoute.sku);
        if (shopRoute.kind === 'success') renderShopSuccess();
        if (shopRoute.kind === 'cancel')  renderShopCancel();
        return;
    }

    const slug = slugFromLocation();
    const anchor = anchorFromLocation();
    // Upgrade legacy hash URLs (#/foo) to the canonical path form. Crawlers
    // don't follow fragments but users still get a clean URL in the address bar.
    // Plain #foo hashes are in-page anchors and stay in the URL.
    if (location.hash && !anchor) {
        const clean = slug ? pageHref(slug) : siteRootHref();
        history.replaceState({}, '', clean + location.search);
    }
    await loadIndex();
    if (pages.length === 0) { renderNoPages(); return; }
    if (slug) {
        await loadPage(slug);
    } else {
        // Default: first top-level page by ord (posts never become home).
        // A translated render homes on the translation of that page.
        const byOrd = rows => [...rows].sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
        const en = byOrd(pages.filter(p => !(p.lang || '')));
        let first = en.find(p => !p.parent_slug && p.page_kind !== 'post')
            || en.find(p => p.page_kind !== 'post') || en[0];
        if (LANG) {
            const mine = byOrd(langPages());
            first = (first && mine.find(p => p.translation_of === first.slug))
                || mine.find(p => !p.parent_slug && p.page_kind !== 'post')
                || mine[0] || first;
        }
        history.replaceState({}, '', pageHref(first.slug) + location.search + (anchor ? '#' + encodeURIComponent(anchor) : ''));
        await loadPage(first.slug);
    }
    if (anchor) scrollToAnchor(anchor);
}

window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => {
    // Same-page anchor jump: just scroll, don't re-render.
    const anchor = anchorFromLocation();
    if (anchor && slugFromLocation() === currentSlug) { scrollToAnchor(anchor); return; }
    route();
});

// Intercept intra-site link clicks for SPA navigation.
// Lets Ctrl/Cmd/middle-click still open in a new tab (server renders them fine).
document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="/"]');
    if (!a) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    const href = a.getAttribute('href');
    if (!href) return;
    // On a translated render, only same-language links stay in the SPA; a
    // link out of the language (the switcher, an English cross-link) does a
    // full load so the server re-renders in the right language.
    if (LANG) {
        const lp = new RegExp('^(?:\\/site)?\\/' + LANG + '(?=\\/|$)');
        if (!lp.test(href)) return;
        const stripped = href.replace(lp, '') || '/';
        if (/^\/shop(\/|$|\?)/.test(stripped)) {
            e.preventDefault();
            if (location.pathname + location.search !== href) {
                history.pushState({}, '', href);
            }
            route().then(resetScroll);
            return;
        }
        const post = stripped.match(/^\/blog\/([^\/\?#]+)$/);
        if (post) {
            if (post[1] === 'rss.xml') return;
            e.preventDefault();
            navigateTo(decodeURIComponent(post[1]));
            return;
        }
        if (stripped === '/' || stripped === '/blog' || /^\/blog\?/.test(stripped)) {
            e.preventDefault();
            if (location.pathname + location.search !== href) {
                history.pushState({}, '', href);
            }
            route().then(resetScroll);
            return;
        }
        const m = stripped.match(/^\/([^\/\?#]+)$/);
        if (m && !RESERVED_TOP_PATHS.has(m[1])) {
            e.preventDefault();
            navigateTo(decodeURIComponent(m[1]));
        }
        return;
    }
    if (/^(?:\/site)?\/shop(\/|$|\?)/.test(href)) {
        // Same-origin /shop, /shop/, /shop/{sku}, /shop/success, /shop/cancel
        // (with the /site prefix in preview). Fragment-only /shop#... links
        // stay in-page anchors.
        e.preventDefault();
        if (location.pathname + location.search !== href) {
            history.pushState({}, '', href);
        }
        route().then(resetScroll);
        return;
    }
    // Blog post links: /blog/{slug} or /site/blog/{slug}. The RSS feed is a
    // real document, not a page - let the browser fetch it.
    const post = href.match(/^(?:\/site)?\/blog\/([^\/\?#]+)$/);
    if (post) {
        if (post[1] === 'rss.xml') return;
        e.preventDefault();
        navigateTo(decodeURIComponent(post[1]));
        return;
    }
    // Legacy /site/{slug} form (susi.lp-research.com or old links on xikaku).
    // Single segment only - deeper /site/a/b paths are redirect-map territory
    // and must reach the server. A query (blog filter/page) rides along.
    const legacy = href.match(/^\/site\/([^\/\?#]+)(\?[^#]*)?$/);
    if (legacy) {
        e.preventDefault();
        if (legacy[2]) {
            history.pushState({}, '', href);
            route().then(resetScroll);
        } else {
            navigateTo(decodeURIComponent(legacy[1]));
        }
        return;
    }
    // Clean form (xikaku.com): /{slug} where slug isn't a reserved top-level path.
    if (SITE_PATH_PREFIX === '') {
        const clean = href.match(/^\/([^\/\?#]+)(\?[^#]*)?$/);
        if (clean && !RESERVED_TOP_PATHS.has(clean[1])) {
            e.preventDefault();
            if (clean[2]) {
                history.pushState({}, '', href);
                route().then(resetScroll);
            } else {
                navigateTo(decodeURIComponent(clean[1]));
            }
        }
    }
});

let historyState = { slug: null, revisions: [], selectedId: null };

async function openHistory() {
    if (!currentSlug) { toast('Save the page first to see history', 'error'); return; }
    historyState = { slug: currentSlug, revisions: [], selectedId: null };
    document.getElementById('historyModal').classList.add('visible');
    renderHistory('<div class="empty-state">Loading revisions…</div>');
    try {
        const resp = await fetch(API + '/website/pages/' + encodeURIComponent(currentSlug) + '/revisions' + siteQ(), {
            headers: { 'Authorization': 'Bearer ' + authToken() },
        });
        if (!resp.ok) { renderHistory('<div class="empty-state">Failed to load revisions.</div>'); return; }
        const data = await resp.json();
        historyState.revisions = data.revisions || [];
        renderHistoryList();
    } catch (e) {
        renderHistory('<div class="empty-state">' + escHtml(e.message) + '</div>');
    }
}

function closeHistory() { document.getElementById('historyModal').classList.remove('visible'); }

function renderHistory(html) { document.getElementById('historyBody').innerHTML = html; }

function renderHistoryList() {
    const revs = historyState.revisions;
    if (!revs.length) {
        renderHistory('<div class="empty-state">No revisions yet. This page has been saved only once - history is captured from the next save onward.</div>');
        return;
    }
    const items = revs.map(r => {
        const when = formatDate(r.captured_at);
        const author = r.author || '-';
        const size = r.body_length + ' chars';
        const sel = r.id === historyState.selectedId ? ' selected' : '';
        return '<div class="rev-item' + sel + '" onclick="selectRevision(' + r.id + ')">'
            + '<div class="rev-when">' + escHtml(when) + '</div>'
            + '<div class="rev-author">' + escHtml(author) + '</div>'
            + '<div class="rev-title">' + escHtml(r.title) + '</div>'
            + '<div class="rev-size">' + size + '</div>'
            + '</div>';
    }).join('');
    const preview = '<div id="revPreview"></div>';
    renderHistory('<div class="rev-list">' + items + '</div>' + preview);
    if (historyState.selectedId) showRevisionPreview(historyState.selectedId);
}

async function selectRevision(id) {
    historyState.selectedId = id;
    // Update selection class without re-rendering the whole list.
    document.querySelectorAll('.rev-item').forEach(el => el.classList.remove('selected'));
    const target = [...document.querySelectorAll('.rev-item')].find(
        el => el.getAttribute('onclick') === 'selectRevision(' + id + ')'
    );
    if (target) target.classList.add('selected');
    await showRevisionPreview(id);
}

async function showRevisionPreview(id) {
    const box = document.getElementById('revPreview');
    if (!box) return;
    box.innerHTML = '<div class="empty-state">Loading…</div>';
    try {
        const resp = await fetch(
            API + '/website/pages/' + encodeURIComponent(historyState.slug)
                + '/revisions/' + id + siteQ(),
            { headers: { 'Authorization': 'Bearer ' + authToken() } },
        );
        if (!resp.ok) { box.innerHTML = '<div class="empty-state">Failed to load.</div>'; return; }
        const data = await resp.json();
        const body = data.body_md || '';
        const snippet = body.length > 4000 ? body.slice(0, 4000) + '\n…[truncated]' : body;
        box.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">'
            + '<strong>' + escHtml(data.title || '') + '</strong>'
            + '<span style="color:var(--text2);font-size:12px;">' + escHtml(formatDate(data.captured_at || '')) + '</span>'
            + '<div style="flex:1"></div>'
            + '<button class="btn primary" onclick="restoreRevision(' + id + ')">Restore this revision</button>'
            + '</div>'
            + '<div class="rev-preview">' + escHtml(snippet) + '</div>';
    } catch (e) {
        box.innerHTML = '<div class="empty-state">' + escHtml(e.message) + '</div>';
    }
}

async function restoreRevision(id) {
    if (!confirm('Restore this revision? Your current editor content will be overwritten, and the current saved state will be captured as a new revision.')) return;
    try {
        const resp = await fetch(
            API + '/website/pages/' + encodeURIComponent(historyState.slug)
                + '/revisions/' + id + '/restore' + siteQ(),
            { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken() } },
        );
        if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            toast(d.error || ('HTTP ' + resp.status), 'error');
            return;
        }
        toast('Revision restored - reloading page', 'success');
        closeHistory();
        // Reload the page content so the editor picks up the restored body.
        cancelEdit();
        await route();
    } catch (e) {
        toast(e.message, 'error');
    }
}

    try {
        const resp = await fetch(API + '/website/admin/assets' + siteQ(), {
            headers: { 'Authorization': 'Bearer ' + authToken() },
        });
        if (!resp.ok) {
            document.getElementById('assetsBody').innerHTML = '<div class="empty-state">Failed to load assets.</div>';
            return;
        }
        const data = await resp.json();
        assetsState.all = data.assets || [];
        renderAssets();
    } catch (e) {
        document.getElementById('assetsBody').innerHTML = '<div class="empty-state">' + escHtml(e.message) + '</div>';
    }
}

function closeAssets() { document.getElementById('assetsModal').classList.remove('visible'); }

function renderAssets() {
    const q = assetsState.filter.toLowerCase();
    const orphansOnly = assetsState.orphansOnly;
    const filtered = assetsState.all.filter(a => {
        if (orphansOnly && a.usage_count > 0) return false;
        if (q && !a.name.toLowerCase().includes(q)) return false;
        return true;
    });
    const assetCount = assetsState.all.length;
    const orphanCount = assetsState.all.filter(a => a.usage_count === 0).length;
    const bar =
        '<div class="asset-toolbar">'
            + '<input type="search" id="assetFilter" placeholder="Filter by name…" value="' + escHtml(assetsState.filter) + '">'
            + '<label><input type="checkbox" id="assetOrphans" ' + (orphansOnly ? 'checked' : '') + '> Orphans only (' + orphanCount + ')</label>'
            + '<span style="color:var(--text2);font-size:12px;">'
                + filtered.length + ' of ' + assetCount + ' shown'
            + '</span>'
        + '</div>';
    if (!filtered.length) {
        document.getElementById('assetsBody').innerHTML = bar + '<div class="empty-state">No assets match the current filter.</div>';
        wireAssetFilters();
        return;
    }
    const tiles = filtered.map(a => {
        const url = API + '/website/assets/' + encodeURIComponent(a.name) + siteQ();
        const kb = (a.size / 1024).toFixed(0) + ' KB';
        const orphan = a.usage_count === 0;
        const pill = orphan
            ? '<span class="asset-usage-pill orphan">orphan</span>'
            : '<span class="asset-usage-pill" title="' + escHtml((a.pages || []).join(', ')) + '">used on ' + a.usage_count + '</span>';
        return '<div class="asset-tile' + (orphan ? ' orphan' : '') + '">'
            + '<div class="asset-thumb"><img src="' + url + '" alt="' + escHtml(a.name) + '" loading="lazy"></div>'
            + '<div class="asset-meta">'
                + '<div class="asset-name">' + escHtml(a.name) + '</div>'
                + '<div class="asset-info">' + pill + '<span>' + kb + '</span></div>'
            + '</div>'
            + '<div class="asset-actions">'
                + '<button onclick="copyAssetMd(\'' + encodeAttr(a.name) + '\')" title="Copy markdown">Copy MD</button>'
                + '<button onclick="renameAsset(\'' + encodeAttr(a.name) + '\')" title="Rename (rewrites page refs)">Rename</button>'
                + '<button class="danger" onclick="deleteAsset(\'' + encodeAttr(a.name) + '\',' + a.usage_count + ')" title="Delete file">Delete</button>'
            + '</div>'
        + '</div>';
    }).join('');
    document.getElementById('assetsBody').innerHTML = bar + '<div class="asset-grid">' + tiles + '</div>';
    wireAssetFilters();
}

function wireAssetFilters() {
    const f = document.getElementById('assetFilter');
    if (f) f.oninput = (e) => { assetsState.filter = e.target.value; renderAssets(); f.focus(); f.setSelectionRange(f.value.length, f.value.length); };
    const o = document.getElementById('assetOrphans');
    if (o) o.onchange = (e) => { assetsState.orphansOnly = e.target.checked; renderAssets(); };
}

function encodeAttr(s) { return (s || '').replace(/'/g, "\\'"); }

function copyAssetMd(name) {
    const md = '![](' + name + '){width=100%}';
    navigator.clipboard.writeText(md).then(
        () => toast('Copied: ' + md, 'success'),
        (e) => toast('Clipboard denied: ' + e.message, 'error'),
    );
}

async function renameAsset(oldName) {
    const next = prompt('New filename (keep the extension):', oldName);
    if (!next || next === oldName) return;
    try {
        const resp = await fetch(API + '/website/assets/' + encodeURIComponent(oldName) + '/rename' + siteQ(), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + authToken(),
            },
            body: JSON.stringify({ new_name: next }),
        });
        const d = await resp.json().catch(() => ({}));
        if (!resp.ok) { toast(d.error || ('HTTP ' + resp.status), 'error'); return; }
        toast('Renamed - rewrote ' + (d.pages_updated || 0) + ' page(s)', 'success');
        await openAssets(); // refresh
    } catch (e) { toast(e.message, 'error'); }
}

async function deleteAsset(name, usageCount) {
    const msg = usageCount > 0
        ? 'This asset is referenced by ' + usageCount + ' page(s). Deleting will break those images. Continue?'
        : 'Delete ' + name + '?';
    if (!confirm(msg)) return;
    try {
        const resp = await fetch(API + '/website/assets/' + encodeURIComponent(name) + siteQ(), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + authToken() },
        });
        if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            toast(d.error || ('HTTP ' + resp.status), 'error');
            return;
        }
        toast('Deleted ' + name, 'success');
        assetsState.all = assetsState.all.filter(a => a.name !== name);
        renderAssets();
    } catch (e) { toast(e.message, 'error'); }
}

// ---------------------------------------------------------------------------
// Shop - product grid, detail, cart, checkout
//
// Cart lives entirely in localStorage. Server-side, /api/v1/shop/checkout
// looks up authoritative prices and creates a Stripe Checkout Session.
// ---------------------------------------------------------------------------

const SHOP_API = '/api/v1/shop';
let shopProducts = [];
let shopProductBySku = new Map();

// Map sensor-page slug -> SKU prefixes for the buy callout. Most pages share
// the slug stem with their SKUs (lpms-ig1 → lpms-ig1-…), but the U3 and AL3
// family pages have variant SKUs that don't share the page's slug stem, so
// they need explicit lists. The "lpms-ig1-" entry has a trailing hyphen so it
// won't match lpms-ig1p-* or lpms-ig1w.
const SLUG_TO_SKU_PREFIXES = {
    'lpms-b2': ['lpms-b2'],
    'lpms-u3': ['lpms-cu3', 'lpms-urs3', 'lpms-uttl3'],
    'lpms-al3': ['lpms-canal3', 'lpms-rs232al3', 'lpms-ttlal3'],
    'lpms-ig1': ['lpms-ig1-'],
    'lpms-ig1p': ['lpms-ig1p'],
    'lpms-ig1w': ['lpms-ig1w'],
    'lpms-nav3': ['lpms-nav3'],
    'lpms-curs3': ['lpms-curs3'],
    'lpms-inc1': ['lpms-inc1'],
    'lpms-hr': ['lpms-hr'],
    'xicap-vision-pro-spatial-accessory': ['xicap-avp'],
    // The lp-research pages kept their WordPress-era slugs.
    'lpms-u3-usb-and-can-bus-imu': ['lpms-cu3', 'lpms-urs3', 'lpms-uttl3'],
    'lpms-al3-9-axis-imu-sensor': ['lpms-canal3', 'lpms-rs232al3', 'lpms-ttlal3'],
    'lpms-curs3-oem-9-axis-imu-ahrs-usb-can-uart': ['lpms-curs3'],
};

// Shop links keep the render language (and the /site prefix in preview).
function shopHref(sub) { return SITE_PATH_PREFIX + LANG_PREFIX + '/shop' + (sub || ''); }

// The Japanese storefront shows JPY (whole yen) when a product carries a yen
// price and falls back to the base USD price otherwise; content follows the
// same rule for title/description.
function shopPrice(p) {
    if (LANG === 'ja' && p.price_jpy > 0) return { amount: p.price_jpy, currency: 'jpy' };
    return { amount: p.price_cents, currency: p.currency };
}
function shopTitle(p) { return (LANG === 'ja' && p.title_ja) ? p.title_ja : p.title; }
function shopDesc(p) { return (LANG === 'ja' && p.description_md_ja) ? p.description_md_ja : p.description_md; }

// One currency per cart: JPY only when every line item has a yen price.
function cartCurrencyFor(cart) {
    const rows = cart.map(r => shopProductBySku.get(r.sku)).filter(Boolean);
    if (LANG === 'ja' && rows.length && rows.every(p => p.price_jpy > 0)) return 'jpy';
    return rows[0] ? rows[0].currency : 'usd';
}

// SKU prefixes key on default-language slugs; a translated page reaches its
// callout through the page it mirrors.
function skuSlugFor(slug) {
    if (SLUG_TO_SKU_PREFIXES[slug]) return slug;
    const p = pages.find(x => x.slug === slug && (x.lang || '') === LANG);
    return (p && p.translation_of && SLUG_TO_SKU_PREFIXES[p.translation_of]) ? p.translation_of : null;
}

// Destinations come from the shop's admin-managed list, fetched once per page.
let shopCountries = null;
let shopCountriesPromise = null;

function loadShopCountries() {
    if (shopCountries) return Promise.resolve(shopCountries);
    if (!shopCountriesPromise) {
        shopCountriesPromise = fetch(SHOP_API + '/shipping_countries' + siteQ())
            .then(r => r.json())
            .then(d => { shopCountries = d.countries || []; return shopCountries; })
            .catch(() => { shopCountriesPromise = null; return []; });
    }
    return shopCountriesPromise;
}

function shopFmtMoney(amount, currency) {
    const cur = (currency || 'usd').toUpperCase();
    // JPY amounts are whole yen (zero-decimal), everything else hundredths.
    if (cur === 'JPY') return '¥' + Math.round(amount).toLocaleString('en-US');
    const val = (amount / 100).toFixed(2);
    const sym = { USD: '$', EUR: '€', GBP: '£' }[cur] || '';
    return sym ? sym + val : val + ' ' + cur;
}

// ---- Cart state ----
function getCart() {
    try { return JSON.parse(localStorage.getItem('susi_cart') || '[]'); } catch (e) { return []; }
}
function setCart(c) { localStorage.setItem('susi_cart', JSON.stringify(c)); renderCartBadge(); renderCart(); }
function addToCart(sku, qty) {
    qty = Math.max(1, parseInt(qty, 10) || 1);
    const cart = getCart();
    const row = cart.find(r => r.sku === sku);
    if (row) row.qty += qty; else cart.push({ sku, qty });
    setCart(cart);
    toast(t('Added to cart'), 'success');
}
function setCartQty(sku, qty) {
    qty = parseInt(qty, 10);
    let cart = getCart();
    if (!isFinite(qty) || qty <= 0) cart = cart.filter(r => r.sku !== sku);
    else cart = cart.map(r => r.sku === sku ? { ...r, qty } : r);
    setCart(cart);
}
function removeFromCart(sku) { setCart(getCart().filter(r => r.sku !== sku)); }

function renderCartBadge() {
    const total = getCart().reduce((s, r) => s + r.qty, 0);
    const b = document.getElementById('cartBadge');
    if (b) {
        if (total > 0) { b.style.display = ''; b.textContent = total; } else { b.style.display = 'none'; }
    }
    updateTopbarVisibility(total);
}

// A topbar-less shop site surfaces the header once the cart has items - the
// cart button lives there; admins keep the header either way.
function updateTopbarVisibility(cartCount) {
    if (!SITE.no_topbar) return;
    if (document.body.classList.contains('admin-topbar')) return;
    const show = !!SITE.has_shop && cartCount > 0;
    document.body.classList.toggle('no-topbar', !show);
}
function renderCart() {
    const cart = getCart();
    const body = document.getElementById('cartBody');
    const btn = document.getElementById('checkoutBtn');
    if (!body || !btn) return;
    if (!cart.length) {
        body.innerHTML = '<div class="empty-state" style="padding:32px 12px;">' + escHtml(t('Your cart is empty.')) + '</div>';
        document.getElementById('cartTotal').textContent = shopFmtMoney(0, LANG === 'ja' ? 'jpy' : 'usd');
        btn.disabled = true;
        const ship = document.getElementById('cartShipRow');
        if (ship) ship.style.display = 'none';
        return;
    }
    btn.disabled = false;
    let subtotal = 0;
    const currency = cartCurrencyFor(cart);
    const html = cart.map(r => {
        const p = shopProductBySku.get(r.sku);
        if (!p) {
            return '<div class="cart-item"><div></div><div>Unknown SKU: ' + escHtml(r.sku) + ' <a href="#" onclick="removeFromCart(\'' + escHtml(r.sku) + '\');return false;">' + escHtml(t('remove')) + '</a></div><div></div></div>';
        }
        const amount = currency === 'jpy' ? p.price_jpy : p.price_cents;
        subtotal += amount * r.qty;
        const img = p.image_url ? '<img src="' + escHtml(p.image_url) + '" alt="">' : '';
        return '<div class="cart-item">'
            + '<div class="cart-item-img">' + img + '</div>'
            + '<div>'
            +   '<div class="cart-item-title">' + escHtml(shopTitle(p)) + '</div>'
            +   '<div class="cart-item-meta">'
            +     '<input type="number" min="1" value="' + r.qty + '" onchange="setCartQty(\'' + escHtml(r.sku) + '\', this.value)">'
            +     '<button class="btn danger" onclick="removeFromCart(\'' + escHtml(r.sku) + '\')" style="padding:3px 8px;font-size:12px;">' + escHtml(t('remove')) + '</button>'
            +   '</div>'
            + '</div>'
            + '<div class="cart-item-price">' + escHtml(shopFmtMoney(amount * r.qty, currency)) + '</div>'
            + '</div>';
    }).join('');
    body.innerHTML = html;
    document.getElementById('cartTotal').textContent = shopFmtMoney(subtotal, currency);
    const shipRow = document.getElementById('cartShipRow');
    if (shipRow) shipRow.style.display = '';
    ensureCountrySelect();
}

async function ensureCountrySelect() {
    const sel = document.getElementById('cartCountry');
    if (!sel || sel.options.length) return;
    const list = await loadShopCountries();
    if (!list.length || sel.options.length) return;
    // A previously saved country may since have been dropped from the list.
    const saved = localStorage.getItem('susi_ship_country');
    const pick = list.some(c => c.code === saved) ? saved : list[0].code;
    sel.innerHTML = list.map(c => '<option value="' + c.code + '"' + (c.code === pick ? ' selected' : '') + '>' + escHtml(c.name) + '</option>').join('');
}
function persistShipCountry() {
    const sel = document.getElementById('cartCountry');
    if (sel) localStorage.setItem('susi_ship_country', sel.value);
}

function openCart() {
    document.getElementById('cartDrawer').classList.add('open');
    document.getElementById('cartOverlay').classList.add('open');
    const err = document.getElementById('cartError');
    if (err) err.style.display = 'none';
    renderCart();
}
function closeCart() {
    document.getElementById('cartDrawer').classList.remove('open');
    document.getElementById('cartOverlay').classList.remove('open');
}

async function checkout() {
    const cart = getCart();
    if (!cart.length) return;
    const country = (document.getElementById('cartCountry') || {}).value || '';
    const btn = document.getElementById('checkoutBtn');
    const err = document.getElementById('cartError');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = t('Redirecting…');
    try {
        const resp = await fetch(SHOP_API + '/checkout' + siteQ(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: cart, destination_country: country, currency: cartCurrencyFor(cart) }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
        if (!data.url) throw new Error('Missing redirect URL');
        window.location = data.url;
    } catch (e) {
        err.textContent = e.message || 'Checkout failed';
        err.style.display = '';
        btn.disabled = false;
        btn.textContent = t('Checkout');
    }
}

// ---- Shop data ----
async function loadShopProducts() {
    if (shopProducts.length) return; // cache: products rarely change in a session
    try {
        const resp = await fetch(SHOP_API + '/products' + siteQ());
        if (!resp.ok) return;
        const data = await resp.json();
        shopProducts = data.products || [];
        shopProductBySku = new Map(shopProducts.map(p => [p.sku, p]));
    } catch (e) {
        shopProducts = []; shopProductBySku = new Map();
    }
}

// ---- Shop renderers ----
function renderShopGrid() {
    currentSlug = '__shop__';
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    if (layout) layout.classList.add('no-toc');
    document.title = t('Shop') + ' - ' + SITE.name;
    renderSidebar();
    if (!shopProducts.length) {
        c.innerHTML = '<h1>' + escHtml(t('Shop')) + '</h1><div class="empty-state"><p>' + escHtml(t('Coming soon.')) + '</p></div>';
        return;
    }
    const cards = shopProducts.map(p => {
        const pr = shopPrice(p);
        const img = p.image_url ? '<img src="' + escHtml(p.image_url) + '" alt="">' : '<div>' + escHtml(t('no image')) + '</div>';
        return '<a class="shop-card" href="' + shopHref('/' + encodeURIComponent(p.sku)) + '">'
            + '<div class="shop-card-img">' + img + '</div>'
            + '<div class="shop-card-body">'
            +   '<div class="shop-card-title">' + escHtml(shopTitle(p)) + '</div>'
            +   '<div class="shop-card-price">' + escHtml(shopFmtMoney(pr.amount, pr.currency)) + '</div>'
            +   '<div class="shop-card-actions">'
            +     '<button class="btn primary" onclick="event.stopPropagation();event.preventDefault();addToCart(\'' + escHtml(p.sku) + '\', 1)">' + escHtml(t('Add to cart')) + '</button>'
            +   '</div>'
            + '</div>'
            + '</a>';
    }).join('');
    const intro = LANG === 'ja'
        ? t('Order %s products directly.').replace('%s', SITE.name)
        : (SITE.id === 'xikaku'
            ? 'Order Xikaku sensors directly. Shipped from our Los Angeles office.'
            : 'Order ' + SITE.name + ' products directly.');
    c.innerHTML = '<h1>' + escHtml(t('Shop')) + '</h1>'
        + '<p style="color:var(--text2);">' + escHtml(intro) + '</p>'
        + '<div class="shop-grid">' + cards + '</div>';
}

function renderShopDetail(sku) {
    currentSlug = '__shop__';
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    if (layout) layout.classList.add('no-toc');
    const p = shopProductBySku.get(sku);
    if (!p) {
        c.innerHTML = '<h1>' + escHtml(t('Product not found')) + '</h1><p><a href="' + shopHref() + '">&larr; ' + escHtml(t('Back to shop')) + '</a></p>';
        return;
    }
    document.title = shopTitle(p) + ' - ' + SITE.name;
    renderSidebar();
    const pr = shopPrice(p);
    const img = p.image_url ? '<img src="' + escHtml(p.image_url) + '" alt="">' : escHtml(t('no image'));
    const desc = renderMarkdown(shopDesc(p) || '');
    c.innerHTML =
        '<p style="margin-top:0;"><a href="' + shopHref() + '">&larr; ' + escHtml(t('Back to shop')) + '</a></p>'
        + '<div class="shop-detail">'
        +   '<div class="shop-detail-img">' + img + '</div>'
        +   '<div>'
        +     '<h1 style="margin-top:0;">' + escHtml(shopTitle(p)) + '</h1>'
        +     '<p style="font-size:18px;color:var(--text1);margin:0 0 16px;">' + escHtml(shopFmtMoney(pr.amount, pr.currency)) + '</p>'
        +     '<div class="content">' + desc + '</div>'
        +     '<div class="shop-detail-buy">'
        +       '<input id="detailQty" type="number" min="1" value="1">'
        +       '<button class="btn primary" onclick="addToCart(\'' + escHtml(p.sku) + '\', document.getElementById(\'detailQty\').value)">' + escHtml(t('Add to cart')) + '</button>'
        +     '</div>'
        +   '</div>'
        + '</div>';
}

function renderShopSuccess() {
    currentSlug = '__shop__';
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    if (layout) layout.classList.add('no-toc');
    document.title = t('Thank you!') + ' - ' + SITE.name;
    renderSidebar();
    const params = new URLSearchParams(location.search);
    const sid = params.get('session_id') || '';
    localStorage.removeItem('susi_cart');
    renderCartBadge();
    if (window.gtag && window.__adsConv && window.__adsConv.purchase) {
        const conv = { send_to: window.__adsConv.purchase };
        if (sid) conv.transaction_id = sid;
        gtag('event', 'conversion', conv);
    }
    c.innerHTML =
        '<div class="empty-state" style="padding:80px 20px;">'
        +   '<h1>' + escHtml(t('Thank you!')) + '</h1>'
        +   '<p>' + escHtml(t('Your order has been placed. A receipt will arrive in your inbox shortly.')) + '</p>'
        +   (sid ? '<p style="color:var(--text2);font-size:12px;">Ref: ' + escHtml(sid) + '</p>' : '')
        +   '<p><a href="' + shopHref() + '">' + escHtml(t('Continue shopping')) + '</a> &middot; <a href="' + siteRootHref() + '">' + escHtml(t('Home')) + '</a></p>'
        + '</div>';
}

function renderShopCancel() {
    currentSlug = '__shop__';
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    if (layout) layout.classList.add('no-toc');
    document.title = t('Checkout cancelled') + ' - ' + SITE.name;
    renderSidebar();
    c.innerHTML =
        '<div class="empty-state" style="padding:80px 20px;">'
        +   '<h1>' + escHtml(t('Checkout cancelled')) + '</h1>'
        +   '<p>' + escHtml(t('Your cart is still saved. No charge was made.')) + '</p>'
        +   '<p><button class="btn primary" onclick="openCart()">' + escHtml(t('Review cart')) + '</button> &nbsp; <a href="' + shopHref() + '">' + escHtml(t('Back to shop')) + '</a></p>'
        + '</div>';
}

// ---- Buy callout on sensor pages ----
function injectBuyCallout(slug) {
    if (!SITE.has_shop) return;
    const prefixes = SLUG_TO_SKU_PREFIXES[slug];
    if (!prefixes || !shopProducts.length) return;
    const matches = shopProducts
        .filter(p => p.active && prefixes.some(pref => p.sku.startsWith(pref)))
        .sort((a, b) => a.ord - b.ord);
    if (!matches.length) return;
    const c = document.getElementById('content');
    if (!c) return;
    const cards = matches.map(p => {
        const pr = shopPrice(p);
        const img = p.image_url ? '<img src="' + escHtml(p.image_url) + '" alt="">' : '';
        return '<a class="buy-card" href="' + shopHref('/' + encodeURIComponent(p.sku)) + '">'
            + '<div class="buy-card-img">' + img + '</div>'
            + '<div class="buy-card-body">'
            +   '<div class="buy-card-title">' + escHtml(shopTitle(p)) + '</div>'
            +   '<div class="buy-card-price">' + escHtml(shopFmtMoney(pr.amount, pr.currency)) + '</div>'
            + '</div>'
            + '</a>';
    }).join('');
    // The cards live inside the page's own Order section when it has one;
    // pages without one get the callout appended with its own heading.
    const orderHead = [...c.querySelectorAll('h2, h3, h4')].find(h => {
        const txt = h.textContent.trim();
        return txt === 'Order' || txt === 'ご注文';
    });
    if (orderHead) {
        orderHead.insertAdjacentHTML('afterend',
            '<div class="buy-callout" style="margin-top:0;padding-top:6px;border-top:none;">'
            + '<div class="buy-grid">' + cards + '</div>'
            + '</div>'
        );
    } else {
        c.insertAdjacentHTML('beforeend',
            '<div class="buy-callout">'
            + '<h2>' + escHtml(t('Available variants')) + '</h2>'
            + '<div class="buy-grid">' + cards + '</div>'
            + '</div>'
        );
    }
}

// Chrome ignores the muted attribute on innerHTML-inserted video when
// deciding autoplay, so set the property and kick playback explicitly.
function startAmbientVideos(root) {
    root.querySelectorAll('video[autoplay]').forEach(v => {
        v.muted = true;
        const p = v.play();
        if (p) p.catch(() => {});
    });
}

// ---- Email obfuscation + contact form ----
function revealEmailObfs(root) {
    const els = root.querySelectorAll('span.email-obf[data-u][data-d]');
    els.forEach(el => {
        let revealed = false;
        const reveal = () => {
            if (revealed) return;
            revealed = true;
            try {
                const u = atob(el.getAttribute('data-u'));
                const d = atob(el.getAttribute('data-d'));
                const addr = u + '@' + d;
                const a = document.createElement('a');
                a.href = 'mailto:' + addr;
                a.textContent = addr;
                a.className = 'email-obf';
                el.replaceWith(a);
            } catch (e) {}
        };
        el.addEventListener('click', reveal);
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
        el.addEventListener('mouseenter', reveal, { once: true });
    });
}

let contactConfigPromise = null;
function loadContactConfig() {
    if (!contactConfigPromise) {
        contactConfigPromise = fetch(API + '/contact/config' + siteQ())
            .then(r => r.ok ? r.json() : { enabled: false, turnstile_site_key: '' })
            .catch(() => ({ enabled: false, turnstile_site_key: '' }));
    }
    return contactConfigPromise;
}

let turnstileScriptPromise = null;
function loadTurnstileScript() {
    if (!turnstileScriptPromise) {
        turnstileScriptPromise = new Promise((resolve, reject) => {
            if (window.turnstile) { resolve(); return; }
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.async = true; s.defer = true;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error('Turnstile script failed to load'));
            document.head.appendChild(s);
        });
    }
    return turnstileScriptPromise;
}

function mountContactForms(root) {
    const slots = root.querySelectorAll('div[data-contact-form]');
    if (!slots.length) return;
    loadContactConfig().then(cfg => {
        slots.forEach(slot => buildContactForm(slot, cfg));
    });
}

function buildContactForm(slot, cfg) {
    if (!cfg.enabled) {
        slot.innerHTML = '<div class="empty-state" style="padding:14px;font-size:13px;">Contact form is currently unavailable. Please email us directly.</div>';
        return;
    }
    slot.innerHTML =
        '<form class="contact-form" novalidate>'
        + '<label>Your name<input type="text" name="name" required maxlength="200" autocomplete="name"></label>'
        + '<label>Company<input type="text" name="company" required maxlength="200" autocomplete="organization"></label>'
        + '<label>Email address<input type="email" name="email" required maxlength="320" autocomplete="email"></label>'
        + '<label>Subject<input type="text" name="subject" required maxlength="200"></label>'
        + '<label>Message<textarea name="message" required minlength="10" maxlength="8000"></textarea></label>'
        + '<label class="hp-field" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></label>'
        + '<div class="note">All fields are required.</div>'
        + '<div class="turnstile-slot"></div>'
        + '<div class="row-actions">'
        +   '<button type="submit" class="btn primary">Send message</button>'
        +   '<span class="status"></span>'
        + '</div>'
        + '</form>';
    const form = slot.querySelector('form');
    const status = form.querySelector('.status');
    const tsSlot = form.querySelector('.turnstile-slot');
    let tsWidgetId = null;
    let tsToken = '';

    if (cfg.turnstile_site_key) {
        loadTurnstileScript().then(() => {
            const renderWidget = () => {
                if (!window.turnstile) return;
                const tsTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                tsWidgetId = window.turnstile.render(tsSlot, {
                    sitekey: cfg.turnstile_site_key,
                    theme: tsTheme,
                    callback: t => { tsToken = t || ''; },
                    'error-callback': () => { tsToken = ''; },
                    'expired-callback': () => { tsToken = ''; },
                });
            };
            // Turnstile attaches a global ready hook when the script finishes.
            if (window.turnstile && window.turnstile.render) renderWidget();
            else if (window.turnstile && window.turnstile.ready) window.turnstile.ready(renderWidget);
            else setTimeout(renderWidget, 200);
        }).catch(() => {
            tsSlot.innerHTML = '<span class="status err">Captcha failed to load - try refreshing.</span>';
        });
    } else {
        tsSlot.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.className = 'status';
        status.textContent = '';
        const fd = new FormData(form);
        const payload = {
            name: (fd.get('name') || '').toString().trim(),
            company: (fd.get('company') || '').toString().trim(),
            email: (fd.get('email') || '').toString().trim(),
            subject: (fd.get('subject') || '').toString().trim(),
            message: (fd.get('message') || '').toString().trim(),
            website: (fd.get('website') || '').toString(),
            turnstile_token: tsToken,
        };
        if (!payload.name || !payload.company || !payload.email || !payload.subject || !payload.message) {
            status.className = 'status err';
            status.textContent = 'Please fill in all fields.';
            return;
        }
        if (cfg.turnstile_site_key && !tsToken) {
            status.className = 'status err';
            status.textContent = 'Please complete the captcha first.';
            return;
        }
        const submitBtn = form.querySelector('button[type=submit]');
        submitBtn.disabled = true;
        try {
            const resp = await fetch(API + '/contact' + siteQ(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (resp.ok) {
                if (window.gtag && window.__adsConv && window.__adsConv.contact) {
                    gtag('event', 'conversion', { send_to: window.__adsConv.contact });
                }
                slot.innerHTML = '<div class="contact-success"><div class="mark">✓</div>'
                    + '<div class="msg">' + t('Thanks - your message is on its way.') + '</div></div>';
                return;
            } else {
                const d = await resp.json().catch(() => ({}));
                status.className = 'status err';
                status.textContent = d.error || ('Could not send (HTTP ' + resp.status + ')');
                if (tsWidgetId !== null && window.turnstile) {
                    try { window.turnstile.reset(tsWidgetId); } catch (e) {}
                }
                tsToken = '';
            }
        } catch (err) {
            status.className = 'status err';
            status.textContent = 'Network error - please try again.';
        } finally {
            submitBtn.disabled = false;
        }
    });
}

// ---- Routing for shop ----
function shopRouteFromLocation() {
    if (!SITE.has_shop) return null;
    let path = location.pathname || '';
    // The shop lives at /shop under the render language, and under /site in
    // the dashboard preview - strip both before matching.
    if (SITE_PATH_PREFIX && path.startsWith(SITE_PATH_PREFIX)) path = path.slice(SITE_PATH_PREFIX.length);
    if (LANG_PREFIX && (path === LANG_PREFIX || path.startsWith(LANG_PREFIX + '/'))) path = path.slice(LANG_PREFIX.length);
    if (path === '/shop' || path === '/shop/') return { kind: 'grid' };
    if (path === '/shop/success') return { kind: 'success' };
    if (path === '/shop/cancel') return { kind: 'cancel' };
    const m = path.match(/^\/shop\/([^\/]+)$/);
    if (m) return { kind: 'detail', sku: decodeURIComponent(m[1]) };
    return null;
}

// Rewrite static "/site" home-links so on xikaku.com the brand and "Home"
// links point to "/" directly instead of triggering a 301 hop through nginx.
// In the dashboard preview they navigate fully, so carry the site along.
document.querySelectorAll('a[href="/site"]').forEach(a => {
    a.setAttribute('href', SITE_PATH_PREFIX ? SITE_PATH_PREFIX + LANG_PREFIX + siteQ() : (LANG_PREFIX || '/'));
});

// Localize the static cart-drawer chrome on translated renders.
if (LANG) {
    const set = (sel, s) => { const el = document.querySelector(sel); if (el) el.textContent = t(s); };
    set('#cartDrawer .cart-head h3', 'Your cart');
    set('#cartShipRow label', 'Ship to');
    set('#cartDrawer .cart-total span', 'Subtotal');
    set('#cartDrawer .cart-hint', 'Tax + shipping calculated at checkout.');
    set('#checkoutBtn', 'Checkout');
}
