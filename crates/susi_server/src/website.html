<script>
// Apply theme before paint to avoid a flash of the wrong colour scheme.
// A theme-locked site ships the right palette from the server and stays put
// (light = data-theme attribute, dark = the attribute-less default).
(function () {
    if (window.__SITE && window.__SITE.theme) return;
    const t = localStorage.getItem('susi_theme') || 'system';
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">

<script src="/docs/easymde.js" defer></script>
<style>
:root {
    --bg: #000000;
    --bg2: #161922;
    --bg3: #1d212c;
    --border: #262b38;
    --text1: #e6e8ec;
    --text2: #9aa0aa;
    --accent: #6aa9ff;
    --accent-soft: rgba(106,169,255,0.15);
    --code-bg: #11141b;
    --radius: 6px;
    --sidebar-width: 280px;
}
:root[data-theme="light"] {
    --bg: #ffffff;
    --bg2: #f5f6f8;
    --bg3: #eceef2;
    --border: #d8dbe1;
    --text1: #1a1d23;
    --text2: #5c6470;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,0.10);
    --code-bg: #f1f3f6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
* { scrollbar-width: thin; scrollbar-color: var(--bg3) var(--bg2); }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: var(--bg2); }
*::-webkit-scrollbar-thumb {
    background: var(--bg3);
    border-radius: 5px;
    border: 2px solid var(--bg2);
}
*::-webkit-scrollbar-thumb:hover { background: var(--border); }
*::-webkit-scrollbar-corner { background: var(--bg2); }
body {
    background: var(--bg);
    color: var(--text1);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.43;
    min-height: 100vh;
}
/* Photo background theme (SiteConfig.bg_image): one fixed image layer under
   the whole page with a single theme-tinted veil over it - the one global
   transparency knob (the color-mix percentage below). All surfaces above stay
   transparent; browsers without color-mix keep the flat opaque theme. */
.site-bg {
    position: fixed; inset: 0; z-index: -1;
    background: var(--bg) url('/static/bg.jpg') center / cover no-repeat;
}
.site-bg::after {
    content: ""; position: absolute; inset: 0;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) var(--bg-veil, 72%), transparent);
}
/* Parallax: overscan the image layer so it can drift with the scroll
   without exposing an edge. */
body.bg-parallax .site-bg {
    inset: -120px 0;
    will-change: transform;
}
body.has-bg { background: transparent; }
body.has-bg .header,
body.has-bg .sidebar,
body.has-bg .toc-rail,
body.has-bg .site-footer { background: transparent; }
/* Scrolling happens inside .page-scroll, clipped below the top bar, so
   content never passes under it. The sticky rails re-anchor to the
   container top; sticky admin bars anchor to 0 instead of the header. */
body.has-bg { height: 100dvh; overflow: hidden; }
body.has-bg .page-scroll { height: calc(100dvh - 56px); overflow-y: auto; }
body.has-bg .sidebar,
body.has-bg .toc-rail { top: 0; }
body.has-bg .editor-toolbar { top: 0; }
.header {
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 10;
}
.header .brand {
    color: inherit; text-decoration: none;
    font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
    display: flex; align-items: center;
}
.header .brand img { height: 28px; display: block; }
.header .brand img.logo-light,
.content img.logo-light { display: none; }
:root[data-theme="light"] .header .brand img.logo-dark,
:root[data-theme="light"] .content img.logo-dark { display: none; }
:root[data-theme="light"] .header .brand img.logo-light { display: block; }
:root[data-theme="light"] .content img.logo-light { display: block; }
.header-right { display: flex; gap: 10px; align-items: center; margin-left: auto; }
.btn {
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text1);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    min-height: 32px;
}
.btn:hover { background: var(--bg3); }
.nav-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text1);
    width: 40px; height: 36px;
    border-radius: var(--radius);
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
}
.nav-toggle:hover { background: var(--bg3); }
.nav-toggle svg { width: 20px; height: 20px; display: block; stroke: currentColor; }
.nav-overlay {
    position: fixed; inset: 56px 0 0 0;
    background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 140;
}
.nav-overlay.open { opacity: 1; pointer-events: auto; }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #e2615e; }

.layout {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr var(--sidebar-width);
    min-height: calc(100vh - 56px);
}
.layout.no-sidebar { grid-template-columns: 1fr var(--sidebar-width); }
.layout.no-sidebar .sidebar { display: none; }
.layout.no-toc { grid-template-columns: var(--sidebar-width) 1fr; }
.layout.no-toc .toc-rail { display: none; }
.layout.no-sidebar.no-toc { grid-template-columns: 1fr; }
.site-footer {
    display: flex;
    gap: 20px;
    justify-content: center;
    padding: 18px 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
}
.site-footer a { color: var(--text2); text-decoration: none; }
.site-footer #langSwitch span { color: var(--text2); }
.lang-switch-top { font-size: 13px; white-space: nowrap; }
.lang-switch-top span { color: var(--text2); }
.lang-switch-top a { color: var(--accent); text-decoration: none; }
.site-footer a:hover { color: var(--text1); }
.sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg);
    /* Rails and content share a 24px top inset (.content, .toc-rail). */
    padding: 24px 0;
    overflow-y: auto;
    /* Reserve the scrollbar lane so the brand logo keeps one width whether
       the nav overflows or not. */
    scrollbar-gutter: stable;
    max-height: calc(100vh - 56px);
    position: sticky;
    top: 56px;
}
.sidebar h3 {
    font-size: 11px;
    font-weight: 400;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 16px 16px 8px;
}
.sidebar a {
    display: block;
    color: var(--text1);
    text-decoration: none;
    font-size: 16px;
    padding: 6px 16px 6px 24px;
    border-left: 2px solid transparent;
}
.sidebar a:hover { color: var(--accent); }
.sidebar a.active {
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
}
.sidebar a.section-head {
    padding-left: 24px;
}
.sidebar a .chev {
    display: inline-block;
    width: 14px;
    font-size: 9px;
    color: var(--text2);
}
.sidebar .sidebar-children.collapsed { display: none; }
.sidebar .sidebar-children a { padding-left: 40px; }
.sidebar .empty { padding: 16px; color: var(--text2); font-size: 14px; }
.sidebar a.sidebar-brand {
    display: block;
    margin: 0 40px 22px 50px;
    padding: 0;
    border-left: none;
    color: inherit; text-decoration: none;
    font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
}
.sidebar-brand img { display: block; max-width: 100%; height: auto; }
.sidebar-brand img.logo-light { display: none; }
:root[data-theme="light"] .sidebar-brand img.logo-dark { display: none; }
:root[data-theme="light"] .sidebar-brand img.logo-light { display: block; }

/* Topbar-less mode (SiteConfig.no_topbar): the header is hidden for
   visitors (admins keep it - the edit controls live there). The sidebar
   brand is its own flag (SiteConfig.sidebar_logo). */
body.no-topbar .header { display: none; }
/* The sidebar carries the brand - don't repeat it in the top bar. */
body.sidebar-logo .header .brand { display: none; }
/* The admin's restored top bar skips the brand - the sidebar carries it. */
body.admin-topbar .header .brand { display: none; }
body.admin-topbar .header { justify-content: flex-end; }
body.no-topbar .layout { min-height: 100vh; }
body.no-topbar .sidebar { top: 0; max-height: 100vh; }
body.no-topbar .toc-rail { top: 0; max-height: 100vh; }
body.no-topbar .nav-overlay { inset: 0; }
body.no-topbar.has-bg .page-scroll { height: 100dvh; }
.nav-toggle-float {
    display: none;
    position: fixed; top: 10px; left: 10px; z-index: 160;
    width: 40px; height: 36px; padding: 0;
    align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--border); color: var(--text1);
    border-radius: var(--radius); cursor: pointer;
}
.nav-toggle-float svg { width: 20px; height: 20px; display: block; stroke: currentColor; }

.content {
    padding: 24px 56px 40px;
    max-width: 880px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    font-size: 16px;
    line-height: 1.71;
}
.content h1 { font-size: 28px; margin: 0 0 18px; font-weight: 400; line-height: 1.14; }
.content h2 { font-size: 21px; margin: 32px 0 12px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.content h3 { font-size: 16px; margin: 24px 0 10px; font-weight: 600; }
.content h4 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; color: var(--text2); }
.content p { margin: 10px 0; }
.content code {
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "SF Mono", "Consolas", "Fira Code", monospace;
    font-size: 12.5px;
}
.content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
    margin: 14px 0;
}
.content pre code { background: transparent; padding: 0; font-size: inherit; }
.content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 8px 14px;
    margin: 14px 0;
    color: var(--text1);
    border-radius: 0 var(--radius) var(--radius) 0;
}
.content table { border-collapse: collapse; margin: 14px 0; width: 100%; }
.content .table-scroll { overflow-x: auto; max-width: 100%; margin: 14px 0; -webkit-overflow-scrolling: touch; }
.content .table-scroll table { margin: 0; }
.content th, .content td {
    border: 1px solid var(--border);
    padding: 7px 11px; text-align: left; vertical-align: top;
}
.content th { background: var(--bg2); font-weight: 600; }
.content tr:nth-child(even) td { background: var(--bg2); }
.content div.grid,
.EasyMDEContainer .editor-preview div.grid,
.EasyMDEContainer .editor-preview-side div.grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    gap: 28px; align-items: start; margin: 16px 0;
}
div.grid.cols-3 { --cols: 3; }
div.grid.cols-4 { --cols: 4; }
div.grid.cols-5 { --cols: 5; }
div.grid.cols-6 { --cols: 6; }
@media (max-width: 760px) {
    .content div.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
    .content div.grid.cols-2 { grid-template-columns: 1fr; }
}
@media (max-width: 460px) {
    .content div.grid { grid-template-columns: 1fr; }
    .content div.grid.cols-4, .content div.grid.cols-5,
    .content div.grid.cols-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.content .video-embed { position: relative; padding-top: 56.25%; margin: 16px 0; }
.content .video-embed iframe {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; border: 0;
    border-radius: var(--radius);
}
.content ul, .content ol { margin: 10px 0; padding-left: 24px; }
.content li { margin: 4px 0; }
.content a { color: var(--accent); text-decoration: none; }
.content a:hover { text-decoration: underline; }
.content img { max-width: 100%; height: auto; border-radius: var(--radius); display: block; margin: 16px auto; }
.content video { max-width: 100%; height: auto; border-radius: var(--radius); display: block; margin: 16px auto; }
.content img.no-radius, .EasyMDEContainer .editor-preview img.no-radius,
.EasyMDEContainer .editor-preview-side img.no-radius { border-radius: 0; }
.content hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
.content td img, .content th img, .content div.grid img { display: inline-block; margin: 0; }
.content h1, .content h2, .content h3, .content h4 { scroll-margin-top: 72px; }

.meta {
    color: var(--text2);
    font-size: 14px;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
}

/* Blog index (/blog): full posts inline, separated by a rule; the date line
   above each post links to its permalink. */
.blog-index-item { margin: 28px 0; }
.blog-index-item + .blog-index-item {
    border-top: 1px solid var(--border);
    padding-top: 32px;
}
.blog-index-item .meta {
    margin-bottom: 4px;
    padding-bottom: 0;
    border-bottom: none;
    font-size: 13px;
}
.blog-index-item .meta a { color: inherit; text-decoration: none; }
.blog-index-item .meta a:hover { text-decoration: underline; }
.blog-index-item .meta a.edit-post { color: var(--accent); }
/* The headline is the primary link to the post - style it like the heading
   it replaces, not like body copy. */
.blog-index-item h1 a { color: inherit; text-decoration: none; }
.blog-index-item h1 a:hover { color: var(--accent); }
.blog-pager { display: flex; align-items: center; gap: 16px; margin: 28px 0; }
.blog-pager a { color: var(--accent); text-decoration: none; }
.blog-pager span { color: var(--text2); font-size: 14px; }

/* EasyMDE theme overrides - match the surrounding dark UI. */
.EasyMDEContainer { background: var(--bg); }
.EasyMDEContainer .CodeMirror {
    background: var(--code-bg);
    color: var(--text1);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    min-height: 480px;
    font-family: "SF Mono", "Consolas", "Fira Code", monospace;
    font-size: 13px;
}
.EasyMDEContainer .CodeMirror-cursor { border-color: var(--text1); }
.EasyMDEContainer .CodeMirror-selected { background: var(--accent-soft) !important; }
.EasyMDEContainer .CodeMirror-line { color: var(--text1); }
.editor-toolbar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: none;
    opacity: 1 !important;
    position: sticky;
    top: 56px;
    z-index: 9;
}
.editor-toolbar button {
    color: var(--text1) !important;
    border: 1px solid transparent !important;
    border-radius: 4px !important;
    padding: 4px 8px !important;
    font-size: 12px !important;
    font-weight: 500;
    background: transparent !important;
    min-width: 32px;
    text-align: center;
}
.editor-toolbar button:hover, .editor-toolbar button.active {
    background: var(--bg3) !important;
    border-color: var(--border) !important;
}
.editor-toolbar i.separator { border-left: 1px solid var(--border); margin: 0 4px; }
.editor-statusbar {
    background: var(--bg2);
    color: var(--text2);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 4px 10px;
    font-size: 11px;
}
.EasyMDEContainer .editor-preview, .EasyMDEContainer .editor-preview-side {
    background: var(--bg); color: var(--text1);
    border: 1px solid var(--border); padding: 16px 20px;
}
.EasyMDEContainer .editor-preview-active-side { display: block; }
.EasyMDEContainer .editor-preview img, .EasyMDEContainer .editor-preview-side img {
    max-width: 100%; border-radius: var(--radius);
}
.EasyMDEContainer .editor-preview h1, .EasyMDEContainer .editor-preview-side h1 { font-size: 22px; margin: 0 0 12px; }
.EasyMDEContainer .editor-preview h2, .EasyMDEContainer .editor-preview-side h2 {
    font-size: 17px; margin: 18px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
}
.EasyMDEContainer .editor-preview code, .EasyMDEContainer .editor-preview-side code {
    background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 12px;
}
.EasyMDEContainer .editor-preview pre, .EasyMDEContainer .editor-preview-side pre {
    background: var(--code-bg); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius);
}
.EasyMDEContainer .editor-preview table, .EasyMDEContainer .editor-preview-side table {
    border-collapse: collapse; width: 100%; font-size: 12px;
}
.EasyMDEContainer .editor-preview th, .EasyMDEContainer .editor-preview td,
.EasyMDEContainer .editor-preview-side th, .EasyMDEContainer .editor-preview-side td {
    border: 1px solid var(--border); padding: 5px 8px; text-align: left;
}
.EasyMDEContainer .editor-preview th, .EasyMDEContainer .editor-preview-side th { background: var(--bg2); }

.edit-meta-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px; align-items: center;
}
.edit-meta-row label { font-size: 12px; color: var(--text2); }
.edit-meta-row input, .edit-meta-row select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text1);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
}
.edit-actions {
    display: flex; gap: 8px; margin-top: 14px;
    position: sticky; bottom: 0;
    background: var(--bg);
    padding: 12px 0;
    border-top: 1px solid var(--border);
    z-index: 9;
}

.preview-banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 9;
    background: var(--bg);
    padding: 10px 0; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text2);
}
.preview-pill {
    padding: 3px 12px; border-radius: 999px;
    background: rgba(251,191,36,0.15); color: #b45309;
    font-size: 12px; font-weight: 600;
}

.toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text1); padding: 10px 18px;
    border-radius: var(--radius); font-size: 13px;
    z-index: 100; opacity: 0; transition: opacity 0.2s;
}
.toast.visible { opacity: 1; }
.toast.error { border-color: #e2615e; color: #e2615e; }
.toast.success { border-color: #5fb878; color: #5fb878; }

.empty-state {
    color: var(--text2); text-align: center;
    padding: 80px 20px; font-size: 14px;
}
.empty-state h2 { color: var(--text1); margin-bottom: 8px; font-weight: 500; }

/* Admin modals (history + assets) */
.admin-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
}
.admin-modal.visible { display: flex; }
.admin-modal-inner {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius);
    width: min(1000px, 95vw); max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
}
.admin-modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.admin-modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.admin-modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; font-size: 13px; }
.admin-modal-foot {
    display: flex; gap: 8px; padding: 12px 18px;
    border-top: 1px solid var(--border);
    align-items: center;
}

.rev-list { display: flex; flex-direction: column; gap: 6px; }
.rev-item {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
}
.rev-item:hover { background: var(--bg2); }
.rev-item.selected { border-color: var(--accent); background: var(--bg2); }
.rev-when { font-size: 12px; color: var(--text2); width: 170px; flex-shrink: 0; }
.rev-author { font-size: 12px; color: var(--text2); width: 140px; flex-shrink: 0; }
.rev-title { flex: 1; color: var(--text1); }
.rev-size { color: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; }
.rev-preview {
    margin-top: 14px; padding: 12px;
    background: var(--bg2); border-radius: var(--radius);
    max-height: 300px; overflow: auto;
    font-family: ui-monospace, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
}

.asset-toolbar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap;
}
.asset-toolbar input[type="search"] {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text1); padding: 6px 10px;
    border-radius: var(--radius); font-size: 13px;
    font-family: inherit; flex: 1; min-width: 180px;
}

<script>
const THEME_LOCK = (window.__SITE && window.__SITE.theme) || '';
function applyTheme(t) {
    if (THEME_LOCK) {
        if (THEME_LOCK === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        const b = document.getElementById('btnTheme');
        if (b) b.style.display = 'none';
        return;
    }
    const root = document.documentElement;
    if (t === 'system') {
        root.removeAttribute('data-theme');
        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (prefersLight) root.setAttribute('data-theme', 'light');
    } else {
        root.setAttribute('data-theme', t);
    }
    const btn = document.getElementById('btnTheme');
    if (btn) {
        btn.textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🌓';
        btn.title = 'Theme: ' + t + ' (click to cycle)';
    }
}
function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('navOverlay');
    if (!sb) return;
    const open = sb.classList.toggle('open');
    if (ov) ov.classList.toggle('open', open);
}
function closeSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('navOverlay');
    if (sb) sb.classList.remove('open');
    if (ov) ov.classList.remove('open');
}
document.addEventListener('click', (e) => {
    const sb = document.getElementById('sidebar');
    if (!sb || !sb.classList.contains('open')) return;
    const a = e.target.closest('a');
    if (a && sb.contains(a)) closeSidebar();
});

function cycleTheme() {
    if (THEME_LOCK) return;
    const cur = localStorage.getItem('susi_theme') || 'system';
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'system' : 'dark';
    localStorage.setItem('susi_theme', next);
    applyTheme(next);
}
applyTheme(localStorage.getItem('susi_theme') || 'system');
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
        if ((localStorage.getItem('susi_theme') || 'system') === 'system') applyTheme('system');
    });
}

// Light parallax: the photo drifts opposite to the scroll, spending its
// overscan across the page's full scroll range.
(function () {
    const bg = document.querySelector('.site-bg');
    const ps = document.getElementById('pageScroll');
    if (!bg || !ps || !document.body.classList.contains('bg-parallax')) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const OVERSCAN = 120;
    let ticking = false;
    function apply() {
        ticking = false;
        const max = ps.scrollHeight - ps.clientHeight;
        const y = max > 0 ? (ps.scrollTop / max) * OVERSCAN : 0;
        bg.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
    }
    ps.addEventListener('scroll', () => {
        if (!ticking) { ticking = true; requestAnimationFrame(apply); }
    }, { passive: true });
})();

const API = '/api/v1';

// Per-site config injected by the server (sites.rs). The fallback keeps the
// shell working if the marker was not replaced (e.g. a stale cached page).
const SITE = window.__SITE || { id: 'xikaku', name: 'Xikaku', hosts: ['xikaku.com', 'www.xikaku.com'], brand_logo: '/static/logo.png', brand_logo_dark: '/static/logo-dark.png', has_shop: true, has_newsletter: true, has_blog: true };
// Content language of this render, injected by the server ("" = default).
// A translated page lives at the same URLs one /{lang}/ segment deeper.
const LANG = SITE.lang || '';
const LANGS = SITE.langs || [];
const LANG_PREFIX = LANG ? '/' + LANG : '';
function langPages() { return pages.filter(p => (p.lang || '') === LANG); }
// Chrome strings for translated renders; anything unlisted stays English.
const L10N = {
    ja: {
        'Blog': 'ブログ', 'Newsletter': 'ニュースレター', 'Shop': 'ショップ',
        'Privacy Policy': 'プライバシーポリシー', 'Imprint': '運営者情報',
        'Cookie settings': 'クッキー設定', 'On this page': 'このページの内容',
        // Sidebar group titles from the shared nav_structure setting.
        'Product': '製品', 'Technology': '技術情報', 'Order': 'ご注文',
        'Company': '会社情報', 'Legal': '規約・ポリシー',
        'Online Shop': 'オンラインショップ',
        'Support': 'サポート', 'Documentation': 'ドキュメント',
        'Customer Area': 'カスタマーエリア',
        'Thanks - your message is on its way.': 'お問い合わせありがとうございます。メッセージを送信しました。',
        'show email': 'メールを表示',
        // Shop storefront chrome.
        'Your cart': 'カート', 'Ship to': 'お届け先', 'Subtotal': '小計',
        'Tax + shipping calculated at checkout.': '税金と送料はチェックアウト時に計算されます。',
        'Checkout': 'レジに進む', 'Redirecting…': 'リダイレクト中…',
        'Your cart is empty.': 'カートは空です。',
        'Added to cart': 'カートに追加しました', 'Add to cart': 'カートに追加',
        'remove': '削除', 'no image': '画像なし', 'Coming soon.': '近日公開。',
        'Back to shop': 'ショップに戻る', 'Product not found': '製品が見つかりません',
        'Continue shopping': '買い物を続ける', 'Home': 'ホーム',
        'Thank you!': 'ありがとうございます！',
        'Your order has been placed. A receipt will arrive in your inbox shortly.': 'ご注文を承りました。まもなく確認メールが届きます。',
        'Checkout cancelled': 'チェックアウトはキャンセルされました',
        'Your cart is still saved. No charge was made.': 'カートの内容は保存されています。請求は発生していません。',
        'Review cart': 'カートを確認', 'Available variants': '製品バリエーション',
        'Order %s products directly.': '%sの製品を直接ご注文いただけます。',
    },
};
function t(s) { return (LANG && L10N[LANG] && L10N[LANG][s]) || s; }

// Website API calls carry the site explicitly so editing keeps targeting the
// rendered site even from a host that resolves to none (dashboard preview);
// the language rides along so page reads and edits stay in this translation.
function siteQ(sep) {
    return (sep || '?') + 'site=' + encodeURIComponent(SITE.id)
        + (LANG ? '&lang=' + encodeURIComponent(LANG) : '');
}

// On a site's canonical hosts the website lives at clean URLs (/contact,
// /about, etc.). On other hosts (susi.lp-research.com) it stays under
// /site/{slug} so the admin dashboard at / isn't shadowed.
const CANONICAL_HOSTS = SITE.hosts;
const SITE_PATH_PREFIX = CANONICAL_HOSTS.includes(location.host) ? '' : '/site';

// The brand/asset endpoints resolve the site from the Host header. Off the
// canonical hosts (dashboard preview) that resolves to the default site, so
// those URLs must carry ?site= explicitly to serve THIS site's files.
function previewAssetUrl(u) {
    if (!SITE_PATH_PREFIX || !u || !u.startsWith('/')) return u;
    if (!u.startsWith('/static/') && !u.startsWith(API + '/website/assets/') && !u.startsWith('/favicon.ico')) return u;
    const p = new URL(u, location.origin);
    if (!p.searchParams.has('site')) p.searchParams.set('site', SITE.id);
    return p.pathname + p.search;
}

// Top-level paths that must NOT be intercepted as website slugs on xikaku.com.
const RESERVED_TOP_PATHS = new Set(['site', 'shop', 'api', 'static', 'docs', 'robots.txt', 'sitemap.xml', 'llms.txt', 'favicon.ico', 'health', '.well-known', 'customer-area', 'login']);
LANGS.forEach(l => RESERVED_TOP_PATHS.add(l));

// Root-relative links authored in page bodies use the clean-URL form; under
// /site they need the prefix (and the site param, so open-in-new-tab and
// reload keep the context) or they fall into the dashboard's namespace.
function previewPageLink(u) {
    if (!SITE_PATH_PREFIX) return u;
    if (u.startsWith('/static/') || u.startsWith(API + '/')) return previewAssetUrl(u);
    const head = u.split(/[\/?#]/).filter(Boolean)[0] || '';
    if (RESERVED_TOP_PATHS.has(head)) return u;
    const p = new URL(SITE_PATH_PREFIX + (u === '/' ? '' : u), location.origin);
    if (!p.searchParams.has('site')) p.searchParams.set('site', SITE.id);
    return p.pathname + p.search + p.hash;
}

// Same Host-resolution problem for the favicon links and the background
// artwork the server injected into the shell; and SPA navigation writes
// clean /site URLs that would lose the site context on reload - keep the
// ?site= on every history write instead of threading it through each URL
// builder.
if (SITE_PATH_PREFIX) {
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l => {
        l.href = previewAssetUrl(l.getAttribute('href'));
    });
    const bg = document.querySelector('.site-bg');
    const bgm = bg && bg.style.backgroundImage.match(/url\(["']?([^"')]+)["']?\)/);
    if (bgm) bg.style.backgroundImage = 'url("' + previewAssetUrl(bgm[1]) + '")';

    // The SSR body is rendered host-agnostically too; patch it before first
    // paint so the preview never flashes the default site's artwork while
    // the SPA boots (this script runs before the browser renders).
    document.querySelectorAll('#content img[src^="/"], #sidebar img[src^="/"]').forEach(el => {
        el.src = previewAssetUrl(el.getAttribute('src'));
    });
    document.querySelectorAll('#content a[href^="/"]').forEach(el => {
        el.setAttribute('href', previewPageLink(el.getAttribute('href')));

    const keepSite = (url) => {
        if (typeof url !== 'string') return url;
        if (url !== '/site' && !/^\/site[\/?#]/.test(url)) return url;
        const p = new URL(url, location.origin);
        if (!p.searchParams.has('site')) p.searchParams.set('site', SITE.id);
        return p.pathname + p.search + p.hash;
    };
    const rawPush = history.pushState.bind(history);
    const rawReplace = history.replaceState.bind(history);
    history.pushState = (s, t, url) => rawPush(s, t, keepSite(url));
    history.replaceState = (s, t, url) => rawReplace(s, t, keepSite(url));
}

// Markdown renderer (same as docs.html)
// ---------------------------------------------------------------------------

function videoEmbedSrc(url) {
    let m = url.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)(?:\/([a-f0-9]+))?/);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] ? '?h=' + m[2] : '');
    m = url.match(/^https?:\/\/player\.vimeo\.com\/video\/\d+/);
    if (m) return url;
    m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = url.match(/^https?:\/\/youtu\.be\/([A-Za-z0-9_-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/embed\/[A-Za-z0-9_-]+/);
    if (m) return url;
    return null;
}

function renderInline(s) {
    // Backslash escapes (\* \_ \# ...) become literal characters, held as
    // placeholders so the emphasis/format passes below can't touch them.
    // The SSR renderer (pulldown-cmark) already handles these - without this
    // the client render showed stray backslashes and runaway italics on the
    // spec-table footnotes.
    const escLits = [];
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|~])/g, (_, c) => {
        escLits.push(c);
        return '\u0000' + (escLits.length - 1) + '\u0000';
    });
    let out = escHtml(s);
    // Allow explicit <br> line breaks (needed for multi-line table cells);
    // the SSR renderer passes them through as inline HTML too.
    out = out.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    out = out.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
    out = out.replace(/\{\{email:([^\s}]+)\}\}/g, (_, addr) => {
        const at = addr.indexOf('@');
        if (at <= 0 || at === addr.length - 1) return escHtml(addr);
        const u = addr.slice(0, at);
        const d = addr.slice(at + 1);
        return '<span class="email-obf" data-u="' + btoa(u) + '" data-d="' + btoa(d) + '" tabindex="0" role="button">' + t('show email') + '</span>';
    });
    out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)(\{[^}]*\})?/g, (_, alt, url, attrs) => {
        const vsrc = videoEmbedSrc(url);
        if (vsrc) {
            return '<div class="video-embed"><iframe src="' + vsrc
                + '" title="' + alt
                + '" allow="autoplay; fullscreen; picture-in-picture"'
                + ' allowfullscreen loading="lazy"></iframe></div>';
        }
        let extra = '';
        if (attrs) {
            const w = attrs.match(/\bwidth\s*=\s*(\d+(?:px|%)?)/i);
            const h = attrs.match(/\bheight\s*=\s*(\d+(?:px|%)?)/i);
            if (w) extra += ' width="' + w[1] + '"';
            if (h) extra += ' height="' + h[1] + '"';
            const classes = [...attrs.matchAll(/\.([A-Za-z][\w-]*)/g)].map(m => m[1]);
            if (classes.length) extra += ' class="' + classes.join(' ') + '"';
        }
        if (/\.(mp4|webm)([?#]|$)/i.test(url)) {
            return '<video src="' + resolveAssetUrl(url) + '"' + extra
                + ' autoplay muted loop playsinline></video>';
        }
        return '<img alt="' + alt + '" src="' + resolveAssetUrl(url) + '"' + extra + '>';
    });
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
        const safe = url.startsWith('http') || url.startsWith('#') ? url
            : url.startsWith('/') ? previewPageLink(url)
            : pageHref(url);
        return '<a href="' + safe + '">' + text + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/\u0000(\d+)\u0000/g, (_, i) => escHtml(escLits[+i]));
    return out;
}

function resolveAssetUrl(url) {
    if (url.startsWith('http') || url.startsWith('data:')) return url;
    if (url.startsWith('/')) return previewAssetUrl(url);
    return API + '/website/assets/' + encodeURIComponent(url) + siteQ();
}

function renderMarkdown(src) {
    if (!src) return '';
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
        const line = lines[i];
        if (line.trim() === '{{contact-form}}') {
            out.push('<div data-contact-form></div>');
            i++;
            continue;
        }
        const fence = line.match(/^```(.*)$/);
        if (fence) {
            const lang = fence[1].trim();
            const buf = [];
            i++;
            while (i < lines.length && !lines[i].match(/^```\s*$/)) {
                buf.push(lines[i]); i++;
            }
            i++;
            out.push('<pre><code' + (lang ? ' class="lang-' + escHtml(lang) + '"' : '') + '>'
                + escHtml(buf.join('\n')) + '</code></pre>');
            continue;
        }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) {
            const level = h[1].length;
            out.push('<h' + level + '>' + renderInline(h[2]) + '</h' + level + '>');
            i++;
            continue;
        }
        if (/^---+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
        if (line.startsWith('> ')) {
            const buf = [];
            while (i < lines.length && lines[i].startsWith('> ')) {
                buf.push(lines[i].slice(2)); i++;
            }
            out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
            continue;
        }
        if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]+\|?\s*$/.test(lines[i+1])) {
            const headers = splitTableRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
                rows.push(splitTableRow(lines[i])); i++;
            }
            const isGrid = headers.every(h => h.trim() === '');
            let html;
            if (isGrid) {
                html = '<div class="grid cols-' + headers.length + '">';
                rows.forEach(r => {
                    for (let c = 0; c < headers.length; c++)
                        html += '<div>' + renderInline(r[c] || '') + '</div>';
                });
                html += '</div>';
            } else {
                html = '<div class="table-scroll"><table><thead><tr>';
                headers.forEach(hh => html += '<th>' + renderInline(hh) + '</th>');
                html += '</tr></thead><tbody>';
                rows.forEach(r => {
                    html += '<tr>';
                    r.forEach(c => html += '<td>' + renderInline(c) + '</td>');
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
            }
            out.push(html);
            continue;
        }
        if (/^[-*]\s+/.test(line)) {
            const buf = [];
            while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
                buf.push(lines[i].replace(/^[-*]\s+/, '')); i++;
            }
            out.push('<ul>' + buf.map(b => '<li>' + renderInline(b) + '</li>').join('') + '</ul>');
            continue;
        }
        const ol = line.match(/^(\d+)\.\s+(.*)$/);
        if (ol) {
            const start = ol[1];
            const buf = [ol[2]];
            i++;
            while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
                buf.push(lines[i].replace(/^\d+\.\s+/, '')); i++;
            }
            const startAttr = start === '1' ? '' : ' start="' + start + '"';
            out.push('<ol' + startAttr + '>' + buf.map(b => '<li>' + renderInline(b) + '</li>').join('') + '</ol>');
            continue;
        }
        if (line.trim() === '') { i++; continue; }
        const para = [line];
        i++;
        while (i < lines.length && lines[i].trim() !== ''
               && !/^(#{1,6}\s|```|>|---+\s*$|[-*]\s|\d+\.\s)/.test(lines[i])
               && !(lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[i+1]))) {
            para.push(lines[i]); i++;
        }
        const joined = para.map((ln, k) =>
            (k < para.length - 1 && /  +$/.test(ln)) ? ln.replace(/\s+$/, '') + '\u0001' : ln
        ).join(' ');
        out.push('<p>' + renderInline(joined).replace(/\u0001/g, '<br>') + '</p>');
    }
    return out.join('\n');
}

function splitTableRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|')) s = s.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let j = 0; j < s.length; j++) {
        if (s[j] === '\\' && j + 1 < s.length && s[j+1] === '|') { cur += '|'; j++; }
        else if (s[j] === '|') { cells.push(cur.trim()); cur = ''; }
        else cur += s[j];
    }
    cells.push(cur.trim());
    return cells;
}

async function loadIndex() {
    const resp = await fetch(API + '/website/pages' + siteQ());
    if (!resp.ok) { return false; }
    const data = await resp.json();
    pages = data.pages || [];
    assets = data.assets || [];
    navStructure = Array.isArray(data.nav) ? data.nav : null;
    return true;
}

async function loadPage(slug) {
    currentSlug = slug;
    // Send the token when present: hidden pages 404 for anonymous visitors
    // but stay reachable for admins so they can be previewed and edited.
    const opts = authToken() ? { headers: { 'Authorization': 'Bearer ' + authToken() } } : {};
    const resp = await fetch(API + '/website/pages/' + encodeURIComponent(slug) + siteQ(), opts);
    if (!resp.ok) {
        currentPage = null;
        // The /blog and /newsletter indexes work without a page row of their
        // own (the row only supplies title/intro).
        if (slug !== 'blog' && slug !== 'newsletter') {
            renderEmptyState('Page "' + slug + '" not found.');
            return;
        }
    } else {
        currentPage = await resp.json();
    }
    editMode = false;
    previewMode = false;
    editDraft = null;
    if (easymde) { try { easymde.toTextArea(); } catch (e) {} easymde = null; }
    // An "Edit" click on the blog index parks its intent here; honour it now
    // that the post is loaded, and clear it so a later visit renders normally.
    if (pendingEdit === slug && currentPage && isPotentialAdmin()) editMode = true;
    pendingEdit = null;
    // A retired page sends visitors on. Admins stay so they can edit it or
    // clear the redirect - they would otherwise never reach the editor.
    if (currentPage && currentPage.redirect_to && !isAdmin) {
        followRedirect(currentPage.redirect_to);
        return;
    }
    renderSidebar();
    renderPage();
}

function sidebarBrandHtml() {
    if (!SITE.sidebar_logo) return '';
    const home = SITE_PATH_PREFIX ? SITE_PATH_PREFIX + LANG_PREFIX + siteQ() : (LANG_PREFIX || '/');
    let inner;
    if (SITE.brand_logo) {
        inner = '<img class="logo-dark" src="' + escHtml(previewAssetUrl(SITE.brand_logo_dark || SITE.brand_logo)) + '" alt="' + escHtml(SITE.name) + '">'
            + '<img class="logo-light" src="' + escHtml(previewAssetUrl(SITE.brand_logo)) + '" alt="' + escHtml(SITE.name) + '">';
    } else {
        inner = escHtml(SITE.name);
    }
    return '<a href="' + escHtml(home) + '" class="sidebar-brand" aria-label="' + escHtml(SITE.name) + '">' + inner + '</a>';
}

function renderSidebar() {
    const sb = document.getElementById('sidebar');
    const layout = document.getElementById('layout');
    const brand = sidebarBrandHtml();
    // Treat /shop as a non-empty sidebar context too - even when there are
    // no pages we still want to show the Shop link.
    const onShop = currentSlug === '__shop__';
    // Posts never appear in the nav; readers reach them via the /blog index.
    // The optional "blog" intro page is covered by the fixed Blog link below.
    // A translated render lists its own language's pages only.
    const navPages = langPages().filter(p => p.page_kind !== 'post' && p.slug !== 'blog');
    if (navPages.length <= 1 && !onShop) {
        // A site with a sidebar logo keeps the sidebar - the brand lives there.
        sb.innerHTML = brand;
        if (layout) layout.classList.toggle('no-sidebar', !brand);
        return;
    }
    if (layout) layout.classList.remove('no-sidebar');
    const byParent = new Map();
    const topLevel = [];
    const slugSet = new Set(navPages.map(p => p.slug));
    navPages.forEach(p => {
        if (p.parent_slug && slugSet.has(p.parent_slug)) {
            if (!byParent.has(p.parent_slug)) byParent.set(p.parent_slug, []);
            byParent.get(p.parent_slug).push(p);
        } else {
            topLevel.push(p);
        }
    });
    topLevel.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
    const renderTop = p => {
        const children = byParent.get(p.slug) || [];
        children.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
        const hasChildren = children.length > 0;
        const expanded = hasChildren && (p.slug === currentSlug || children.some(c => c.slug === currentSlug));
        let h = renderSidebarItem(p, true, hasChildren, expanded);
        if (hasChildren) {
            h += '<div class="sidebar-children' + (expanded ? '' : ' collapsed') + '">';
            children.forEach(c => h += renderSidebarItem(c, false, false, false));
            h += '</div>';
        }
        return h;
    };
    // Fixed Blog/Shop links; '__blog__'/'__shop__' place them inside groups.
    // The Newsletter archive rides directly below Blog wherever it is placed.
    const onPost = currentPage && currentPage.page_kind === 'post';
    const blogActive = (currentSlug === 'blog' || onPost) ? ' active' : '';
    const newsletterActive = currentSlug === 'newsletter' ? ' active' : '';
    const blogLink = (SITE.has_blog === false ? ''
            : '<a class="section-head' + blogActive + '" href="' + SITE_PATH_PREFIX + LANG_PREFIX + '/blog">' + escHtml(t('Blog')) + '</a>')
        + (SITE.has_newsletter && !LANG ? '<a class="section-head' + newsletterActive + '" href="' + SITE_PATH_PREFIX + '/newsletter">Newsletter</a>' : '');
    const shopActive = currentSlug === '__shop__' ? ' active' : '';
    const shopLink = SITE.has_shop ? '<a class="section-head' + shopActive + '" href="' + shopHref() + '">' + escHtml(t('Shop')) + '</a>' : '';
    const bySlug = new Map(topLevel.map(p => [LANG ? (p.translation_of || p.slug) : p.slug, p]));
    let html = '';
    if (navStructure && navStructure.length) {
        // Grouped nav from the "nav_structure" site setting. Ungrouped pages
        // (Home, any newly created top-level page) come first, in ord order.
        const groupedSlugs = new Set(navStructure.flatMap(g => g.items || [])
            .filter(s => typeof s === 'string'));
        const groupKey = p => (LANG ? (p.translation_of || p.slug) : p.slug);
        topLevel.filter(p => !groupedSlugs.has(groupKey(p))).forEach(p => html += renderTop(p));
        navStructure.forEach(g => {
            let body = '';
            (g.items || []).forEach(s => {
                if (s && typeof s === 'object') {
                    body += '<a class="section-head" href="' + escHtml(s.url) + '">'
                        + escHtml(t(s.title)) + '</a>';
                }
                else if (s === '__blog__') body += blogLink;
                else if (s === '__shop__') body += shopLink;
                else if (bySlug.has(s)) body += renderTop(bySlug.get(s));
            });
            if (body) html += '<h3>' + escHtml(t(g.title || '')) + '</h3>' + body;
        });
        // Links no group placed keep their flat-nav position at the end.
        if (!groupedSlugs.has('__blog__')) html += blogLink;
        if (!groupedSlugs.has('__shop__')) html += shopLink;
    } else {
        // No nav config: flat top-level list with Blog and Shop at the end.
        topLevel.forEach(p => html += renderTop(p));
        html += blogLink + shopLink;
    }
    const orphans = navPages.filter(p => p.parent_slug && !slugSet.has(p.parent_slug));
    if (orphans.length) {
        const groups = new Map();
        orphans.forEach(o => {
            if (!groups.has(o.parent_slug)) groups.set(o.parent_slug, []);
            groups.get(o.parent_slug).push(o);
        });
        for (const [g, items] of groups) {
            html += '<h3>' + escHtml(g) + '</h3>';
            items.sort((a, b) => a.ord - b.ord || a.title.localeCompare(b.title));
            items.forEach(it => html += renderSidebarItem(it, false, false, false));
        }
    }
    sb.innerHTML = brand + html;
    renderLangSwitch();
}

function renderSidebarItem(p, isHead, hasChildren, expanded) {
    const cls = (p.slug === currentSlug ? 'active' : '') + (isHead ? ' section-head' : '');
    const chev = hasChildren ? '<span class="chev">' + (expanded ? '▼' : '▶') + '</span>' : '';
    return '<a class="' + cls + '" href="' + pageHref(p.slug) + '">'
        + chev + escHtml(p.title) + '</a>';
}

function renderEmptyState(msg) {
    const layout = document.getElementById('layout');
    if (layout) { layout.classList.add('no-toc'); layout.classList.add('no-sidebar'); }
    document.getElementById('content').innerHTML =
        '<div class="empty-state"><h2>' + escHtml(msg) + '</h2></div>';
    document.getElementById('editBtn').style.display = 'none';
}

// Public /blog view: optional intro from the "blog" page row, then a page of
// full posts, newest first, with the date linking to the permalink. Mirrors
// the SSR index (render_blog_index) including the ?page= query state.
// Admins also see hidden (draft) posts, marked as such.
const BLOG_POSTS_PER_PAGE = 3;

function blogIndexHref(pageNum) {
    return SITE_PATH_PREFIX + LANG_PREFIX + '/blog' + (pageNum > 1 ? '?page=' + pageNum : '');
}

async function renderBlogIndexView() {
    const c = document.getElementById('content');
    updateAdminChrome();
    let pageNum = Math.max(1, parseInt(new URLSearchParams(location.search).get('page'), 10) || 1);
    let html = currentPage
        ? renderMarkdown(currentPage.body_md || '')
        : '<h1>Blog</h1>';
    const posts = langPages().filter(p => p.page_kind === 'post')
        .sort((a, b) => (b.published_at || '').localeCompare(a.published_at || '')
            || a.title.localeCompare(b.title));
    if (!posts.length) {
        html += '<p>No posts yet.</p>';
    } else {
        const totalPages = Math.ceil(posts.length / BLOG_POSTS_PER_PAGE);
        pageNum = Math.min(pageNum, totalPages);
        const visible = posts.slice((pageNum - 1) * BLOG_POSTS_PER_PAGE, pageNum * BLOG_POSTS_PER_PAGE);
        // Full posts inline - bodies are fetched for the visible page only.
        const opts = authToken() ? { headers: { 'Authorization': 'Bearer ' + authToken() } } : {};
        const bodies = await Promise.all(visible.map(async p => {
            try {
                const r = await fetch(API + '/website/pages/' + encodeURIComponent(p.slug) + siteQ(), opts);
                return r.ok ? (await r.json()).body_md || '' : '';
            } catch (e) { return ''; }
        }));
        html += '<div class="blog-index">';
        visible.forEach((p, i) => {
            const permalink = pageHref(p.slug);
            // Admins edit a post straight from the index - otherwise the only
            // way in is the dashboard page list.
            const edit = isAdmin
                ? ' &middot; <a href="#" class="edit-post" onclick="event.preventDefault();editPost('
                  + escHtml(JSON.stringify(p.slug)) + ')">Edit</a>'
                : '';
            html += '<article class="blog-index-item">'
                + '<div class="meta"><a href="' + permalink + '">'
                + escHtml(formatPostDate(p.published_at)) + '</a>'
                + bylineSuffix(p.author_name)
                + (p.hidden ? ' (hidden)' : '')
                + (p.redirect_to ? ' (retired)' : '') + edit + '</div>'
                + linkFirstHeading(renderMarkdown(bodies[i]), permalink)
                + '</article>';
        });
        html += '</div>';
        if (totalPages > 1) {
            html += '<nav class="blog-pager">'
                + (pageNum > 1 ? '<a href="' + escHtml(blogIndexHref(pageNum - 1)) + '">← Newer</a>' : '')
                + '<span>Page ' + pageNum + ' of ' + totalPages + '</span>'
                + (pageNum < totalPages ? '<a href="' + escHtml(blogIndexHref(pageNum + 1)) + '">Older →</a>' : '')
                + '</nav>';
        }
    }
    const { html: withIds, headings } = injectHeadingIds(html);
    c.innerHTML = withIds;
    renderToc(headings);
    revealEmailObfs(c);
    mountContactForms(c);
    startAmbientVideos(c);
}

function renderPage() {
    const c = document.getElementById('content');
    const layout = document.getElementById('layout');
    // The blog index has its own public view; edit/preview of the optional
    // "blog" intro page still uses the normal editor flow below.
    if (currentSlug === 'blog' && !editMode && !(previewMode && editDraft)) {
        renderBlogIndexView();
        return;
    }
    // Same for the newsletter archive and its optional "newsletter" intro page.
    if (currentSlug === 'newsletter' && !editMode && !(previewMode && editDraft)) {
        renderNewsletterIndexView();
        return;
    }
    if (!currentPage) {
        renderEmptyState('Select a page.');
        return;
    }
    updateAdminChrome();
    if (previewMode && editDraft) {
        renderPreviewView();
        return;
    }
    if (editMode) {
        if (layout) layout.classList.add('no-toc');
        renderEditor();
        return;
    }
    const meta = currentPage.page_kind === 'post'
        ? (currentPage.published_at
            ? '<div class="meta">' + escHtml(formatPostDate(currentPage.published_at))
              + bylineSuffix(currentPage.author_name) + '</div>'
            : '')
        : (currentPage.updated_at
            ? '<div class="meta">Updated ' + escHtml(formatDate(currentPage.updated_at)) + '</div>'
            : '');
    // Only admins ever receive hidden pages, so this notice is admin-only.
    const hiddenNotice = currentPage.hidden
        ? '<div style="display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;'
          + 'background:rgba(251,191,36,0.15);color:#b45309;font-size:12px;font-weight:600;">'
          + 'Hidden - this page is not visible to the public</div>'
        : '';
    // Same for a retired page: only an admin ever renders one, everyone else
    // has already been redirected away.
    const retiredNotice = currentPage.redirect_to
        ? '<div style="display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;'
          + 'background:rgba(251,191,36,0.15);color:#b45309;font-size:12px;font-weight:600;">'
          + 'Retired - redirects to ' + escHtml(currentPage.redirect_to) + '</div>'
        : '';
    let html = hiddenNotice + retiredNotice + meta + renderMarkdown(currentPage.body_md || '');
    const { html: withIds, headings } = injectHeadingIds(html);
    c.innerHTML = withIds;
    renderToc(headings);
    revealEmailObfs(c);
    mountContactForms(c);
    startAmbientVideos(c);
    // Append a "buy" callout for sensor pages whose slug maps to live SKUs
    // (translated pages resolve through the page they mirror).
    const skuSlug = SITE.has_shop && currentSlug ? skuSlugFor(currentSlug) : null;
    if (skuSlug) {
        loadShopProducts().then(() => injectBuyCallout(skuSlug));
    }
}

function injectHeadingIds(html) {
    const used = new Map();
    const headings = [];
    function slugify(text) {
        const base = text.toLowerCase()
            .replace(/<[^>]+>/g, '')
            .replace(/&[a-z]+;/g, ' ')
            .replace(/[^\p{L}\p{N}]+/gu, '-')
            .replace(/^-+|-+$/g, '')
            || 'section';
        const n = used.get(base) || 0;
        used.set(base, n + 1);
        return n === 0 ? base : base + '-' + n;
    }
    const out = html.replace(/<h([1-4])(?![^>]*\bid=)([^>]*)>([\s\S]*?)<\/h\1>/g,
        (_m, lvl, attrs, inner) => {
            const level = parseInt(lvl, 10);
            // Decode entities so downstream escHtml doesn't double-escape.
            const text = decodeEntities(inner.replace(/<[^>]+>/g, '')).trim();
            if (!text) return _m;
            const id = slugify(text);
            headings.push({ level, text, id });
            return '<h' + lvl + attrs + ' id="' + id + '">' + inner + '</h' + lvl + '>';
        });
    return { html: out, headings };
}

let tocActiveObserver = null;

function renderToc(headings) {
    const rail = document.getElementById('tocRail');
    const layout = document.getElementById('layout');
    if (!rail) return;
    if (tocActiveObserver) { tocActiveObserver.disconnect(); tocActiveObserver = null; }

    let items = headings.slice();
    const pageTitle = (previewMode && editDraft)
        ? (editDraft.title || '')
        : ((currentPage && currentPage.title) || '');
    if (items.length && items[0].level === 1
        && items[0].text.toLowerCase() === pageTitle.toLowerCase()) {
        items = items.slice(1);
    }
    if (items.length < 2) {
        rail.innerHTML = '';
        if (layout) layout.classList.add('no-toc');
        return;
    }
    if (layout) layout.classList.remove('no-toc');

    // Indent by depth relative to the shallowest heading so pages built on
    // h1 (blog/newsletter indexes) nest the same as h2-based pages.
    const minLevel = Math.min(...items.map(h => h.level));
    const links = items.map(h => {
        const cls = 'lvl-' + Math.min(4, h.level - minLevel + 2);
        return '<a class="' + cls + '" href="#' + h.id + '" data-toc-id="' + h.id + '">' + escHtml(h.text) + '</a>';
    }).join('');
    rail.innerHTML = '<div class="toc-title">' + escHtml(t('On this page')) + '</div>' + links;

    rail.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const id = a.getAttribute('data-toc-id');
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState({}, '', location.pathname + location.search + '#' + encodeURIComponent(id));
        });
    });

    const observed = items.map(h => document.getElementById(h.id)).filter(Boolean);
    const linkById = new Map();
    rail.querySelectorAll('a').forEach(a => linkById.set(a.getAttribute('data-toc-id'), a));
    const setActive = (id) => {
        rail.querySelectorAll('a.active').forEach(a => a.classList.remove('active'));
        const a = linkById.get(id);
        if (a) a.classList.add('active');
    };
    tocActiveObserver = new IntersectionObserver((entries) => {
        const visible = entries
            .filter(e => e.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-72px 0px -60% 0px', threshold: 0 });
    observed.forEach(el => tocActiveObserver.observe(el));
    if (observed[0]) setActive(observed[0].id);
}

let easymde = null;

function renderEditor() {
    const c = document.getElementById('content');
    // A pending draft (returning from preview) takes precedence over saved state.
    const d = editDraft;
    editDraft = null;
    const title = d ? d.title : (currentPage.title || '');
    const parent = d ? d.parent : (currentPage.parent_slug || '');
    const ord = d ? d.ord : (currentPage.ord || 0);
    const body = d ? d.body_md : (currentPage.body_md || '');
    const metaDesc = d ? d.meta_description : (currentPage.meta_description || '');
    const redirect = d ? (d.redirect_to || '') : (currentPage.redirect_to || '');
    const slugVal = d ? d.slug : currentSlug;
    const isPost = (d ? d.page_kind : currentPage.page_kind) === 'post';
    const published = d ? (d.published_at || '') : (currentPage.published_at || '');
    const author = d ? (d.author_username || '') : (currentPage.author_username || '');
    // Posts have a publish date and a byline author instead of nav placement.
    const placementFields = isPost
        ? '<label>Published</label><input id="editPublished" type="date" style="width:150px;">' +
          '<label>Author</label><select id="editAuthor" style="min-width:160px;">' + buildAuthorOptions(author) + '</select>'
        : '<label>Parent</label><select id="editParent" style="min-width:200px;">' + buildParentOptions(parent, currentSlug) + '</select>' +
          '<label>Order</label><input id="editOrd" type="number" style="width:80px;">';
    c.innerHTML =
        '<div class="edit-meta-row">' +
            '<label>Title</label><input id="editTitle" type="text" style="flex:1;min-width:200px;">' +
            '<label>Slug</label><input id="editSlug" type="text" style="width:160px;">' +
            placementFields +
        '</div>' +
        '<div class="edit-meta-row" style="margin-top:8px;">' +
            '<label title="Overrides the auto-derived description for SEO / AI crawlers. Leave empty to auto-derive from body.">SEO description</label>' +
            '<input id="editMetaDesc" type="text" maxlength="300" '
                + 'style="flex:1;min-width:200px;">' +
        '</div>' +
        '<div class="edit-meta-row" style="margin-top:8px;">' +
            '<label title="Retire this page: it stops rendering and permanently redirects here. A slug, a /path, or a full URL. Empty = live.">Redirects to</label>' +
            '<input id="editRedirect" type="text" style="flex:1;min-width:200px;">' +
        '</div>' +
        '<textarea id="editBody"></textarea>' +
        '<div class="edit-actions">' +
            '<button class="btn primary" onclick="savePage()">Save</button>' +
            '<button class="btn" onclick="previewPage()" title="See the page as it will appear on the site, without saving">Preview</button>' +
            '<button class="btn" onclick="cancelEdit()">Cancel</button>' +
            '<button class="btn" onclick="openHistory()" title="Page edit history">History</button>' +
            '<button class="btn" onclick="openAssets()" title="Image & asset library">Assets</button>' +
            '<div style="flex:1"></div>' +
            '<button class="btn danger" onclick="deletePage()">Delete page</button>' +
        '</div>';
    document.getElementById('editTitle').value = title;
    document.getElementById('editSlug').value = slugVal;
    if (isPost) {
        document.getElementById('editPublished').value = published;
        // The user list arrives after the first paint - refill the select once
        // it does, keeping whatever the post already had selected.
        loadAuthors().then(() => {
            const sel = document.getElementById('editAuthor');
            if (sel) sel.innerHTML = buildAuthorOptions(sel.value || author);
        });
    } else {
        document.getElementById('editOrd').value = ord;
    }
    document.getElementById('editMetaDesc').value = metaDesc;
    document.getElementById('editRedirect').value = redirect;
    initEasyMDE(body);
}

// Authors are loaded lazily on first edit of a post - the list is admin-only,
// so a visitor never triggers this fetch.
let authorUsers = null;

async function loadAuthors() {
    if (authorUsers || !authToken()) return;
    try {
        const r = await fetch(API + '/auth/users', {
            headers: { 'Authorization': 'Bearer ' + authToken() },
        });
        authorUsers = r.ok ? await r.json() : [];
    } catch (e) {
        authorUsers = [];
    }
}

function buildAuthorOptions(selected) {
    const opts = ['<option value="">(no byline)</option>'];
    (authorUsers || []).forEach(u => {
        const name = ((u.first_name || '') + ' ' + (u.last_name || '')).trim();
        const sel = u.username === selected ? ' selected' : '';
        opts.push('<option value="' + escHtml(u.username) + '"' + sel + '>'
            + escHtml(name || u.username + ' (no name set)') + '</option>');
    });
    // The list may not have arrived yet, or the author's account is gone -
    // either way, keep the current value instead of silently dropping it.
    if (selected && !(authorUsers || []).some(u => u.username === selected)) {
        opts.push('<option value="' + escHtml(selected) + '" selected>' + escHtml(selected) + '</option>');
    }
    return opts.join('');
}

function buildParentOptions(selected, excludeSlug) {
    const opts = ['<option value="">(none - top level)</option>'];
    const sorted = [...langPages()].sort((a, b) => a.title.localeCompare(b.title));
    const known = new Set();
    sorted.forEach(p => {
        if (p.slug === excludeSlug || p.page_kind === 'post') return;
        known.add(p.slug);
        const sel = p.slug === selected ? ' selected' : '';
        opts.push('<option value="' + escHtml(p.slug) + '"' + sel + '>'
            + escHtml(p.title) + ' (' + escHtml(p.slug) + ')</option>');
    });
    if (selected && !known.has(selected)) {
        opts.push('<option value="' + escHtml(selected) + '" selected>'
            + escHtml(selected) + ' (orphan)</option>');
    }
    return opts.join('');
}

function initEasyMDE(initialBody) {
    if (typeof EasyMDE === 'undefined') {
        toast('Editor failed to load - refresh the page', 'error');
        return;
    }
    if (easymde) { try { easymde.toTextArea(); } catch (e) {} easymde = null; }

    easymde = new EasyMDE({
        element: document.getElementById('editBody'),
        initialValue: initialBody,
        autofocus: true,
        spellChecker: false,
        autoDownloadFontAwesome: false,
        status: ['lines', 'words'],
        uploadImage: true,
        imageUploadFunction: easymdeImageUpload,
        imageMaxSize: 100 * 1024 * 1024,
        imageAccept: 'image/*, video/mp4, video/webm',
        imageTexts: {
            sbInit: 'Attach images by drag-and-drop, paste, or the upload button.',
            sbOnDrop: 'Uploading #images_names#…',
            sbProgress: 'Uploading #file_name#: #progress#%',
            sbOnUploaded: 'Uploaded #image_name#',
            sizeUnits: ' B, KB, MB',
        },
        previewRender: (txt) => renderMarkdown(txt),
        renderingConfig: { singleLineBreaks: false, codeSyntaxHighlighting: false },
        toolbar: [
            { name: 'bold', action: EasyMDE.toggleBold, text: 'B', title: 'Bold' },
            { name: 'italic', action: EasyMDE.toggleItalic, text: 'I', title: 'Italic' },
            { name: 'heading', action: EasyMDE.toggleHeadingSmaller, text: 'H', title: 'Heading' },
            '|',
            { name: 'quote', action: EasyMDE.toggleBlockquote, text: '❝', title: 'Quote' },
            { name: 'code', action: EasyMDE.toggleCodeBlock, text: '</>', title: 'Code block' },
            { name: 'unordered-list', action: EasyMDE.toggleUnorderedList, text: '•', title: 'Bulleted list' },
            { name: 'ordered-list', action: EasyMDE.toggleOrderedList, text: '1.', title: 'Numbered list' },
            { name: 'table', action: EasyMDE.drawTable, text: '⊞', title: 'Insert table' },
            '|',
            { name: 'link', action: EasyMDE.drawLink, text: '🔗', title: 'Insert link' },
            { name: 'upload-image', action: EasyMDE.drawUploadedImage, text: '🖼', title: 'Upload image or video' },
            { name: 'horizontal-rule', action: EasyMDE.drawHorizontalRule, text: '-', title: 'Horizontal rule' },
            '|',
            { name: 'preview', action: EasyMDE.togglePreview, text: '👁', title: 'Toggle preview', noDisable: true },
        ],
    });
}

async function easymdeImageUpload(file, onSuccess, onError) {
    if (!isPotentialAdmin()) { onError('Login required'); return; }
    const name = generateAssetName(file);
    try {
        const fd = new FormData();
        fd.append('file', file, name);
        const resp = await fetch(API + '/website/assets' + siteQ(), {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + authToken() },
            body: fd,
        });
        if (resp.status === 401) {
            onError('Session expired');
            handleSessionExpired(easymde ? easymde.value() : '');
            return;
        }
        if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            onError(d.error || ('HTTP ' + resp.status));
            return;
        }
        const data = await resp.json();
        onSuccess(data.name);
        toast('Uploaded ' + data.name, 'success');
    } catch (e) {
        onError(e.message);
    }
}

function inferExtension(file) {
    const m = (file.type || '').match(/^(?:image|video)\/(\w+)/);
    if (!m) return 'png';
    const ext = m[1].toLowerCase();
    return ext === 'jpeg' ? 'jpg' : ext;
}

function generateAssetName(file) {
    const orig = (file.name || '').replace(/[^A-Za-z0-9._-]/g, '_');
    // Browsers use a generic "image.png" filename for clipboard-pasted
    // images, which collides across pages - always timestamp those.
    const isPasteDefault = /^image\.(png|jpe?g|gif|webp|svg)$/i.test(orig);
    if (orig && !isPasteDefault && /\.[A-Za-z0-9]+$/.test(orig)) return orig;
    const ts = new Date().toISOString().replace(/[:.]/g, '-').replace(/Z$/, '');
    return 'image-' + ts + '.' + inferExtension(file);
}

function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString();
}

async function savePage() {
    const v = editorValues();
    const title = v.title;
    const parent = v.parent;
    const ord = v.ord;
    const body_md = v.body_md;
    const meta_description = v.meta_description;
    const newSlug = v.slug;
    if (!title) { toast('Title is required', 'error'); return; }
    if (!newSlug) { toast('Slug is required', 'error'); return; }

    let targetSlug = currentSlug;
    if (newSlug !== currentSlug) {
        const renameResp = await fetch(API + '/website/pages/' + encodeURIComponent(currentSlug) + '/rename' + siteQ(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken() },
            body: JSON.stringify({ new_slug: newSlug }),
        });
        if (renameResp.status === 401) { handleSessionExpired(body_md); return; }
        if (!renameResp.ok) {
            const d = await renameResp.json().catch(() => ({}));
            toast('Rename failed: ' + (d.error || renameResp.status), 'error');
            return;
        }
        targetSlug = newSlug;
    }

    const resp = await fetch(API + '/website/pages/' + encodeURIComponent(targetSlug) + siteQ(), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken() },
        body: JSON.stringify({
            title, body_md, parent_slug: parent || null, ord, meta_description,
            page_kind: v.page_kind, published_at: v.published_at,
            author_username: v.author_username,
            redirect_to: v.redirect_to,
        }),
    });
    if (resp.status === 401) { handleSessionExpired(body_md); return; }
    if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        toast('Save failed: ' + (d.error || resp.status), 'error');
        return;
    }
    toast('Saved', 'success');
    editMode = false;
    previewMode = false;
    editDraft = null;
    await loadIndex();
    if (targetSlug !== currentSlug) {
        navigateTo(targetSlug);
    } else {
        await loadPage(currentSlug);
    }
}

function handleSessionExpired(currentBody) {
    localStorage.removeItem('auth_token');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;';
    overlay.innerHTML =
        '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:480px;color:var(--text1);">' +
            '<h2 style="margin:0 0 8px;font-size:16px;">Session expired</h2>' +
            '<p style="margin:0 0 14px;color:var(--text2);font-size:13px;">' +
                'Your login token is no longer valid. Copy your edits to the clipboard before logging in again so you don\'t lose them.' +
            '</p>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
                '<button class="btn" id="copyEdits">Copy edits to clipboard</button>' +
                '<button class="btn primary" id="reloginBtn">Log in again</button>' +
            '</div>' +
        '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#copyEdits').onclick = async () => {
        try {
            await navigator.clipboard.writeText(currentBody || '');
            toast('Copied to clipboard', 'success');
        } catch (e) {
            toast('Copy failed - select-all and copy manually', 'error');
        }
    };
    overlay.querySelector('#reloginBtn').onclick = () => {
        window.open('/', '_blank');

        toast('Log in, then come back to this tab and click Save again.', 'success');
    };
}
