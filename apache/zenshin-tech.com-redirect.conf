# zenshin-tech.com -> the LP-Research shop.
#
# This is the live redirect, deployed as a block inside
# /opt/bitnami/apps/wordpress/conf/httpd-prefix.conf on the legacy
# WooCommerce box (bitnami@35.90.2.23), inserted before that file's
# httpd-app.conf include so it runs ahead of WordPress's own rewrites.
# It is kept here as a record; the box is not deployed from this repo.
#
# The redirect lives on the web server rather than in DNS because the
# domain's Route 53 zone sits in an AWS account we do not control (the
# registrar is Alibaba Cloud). Doing it here needs no DNS change and no
# certificate: the Lightsail load balancer keeps terminating TLS.
#
# Revert: delete this block, or restore the httpd-prefix.conf.bak-<stamp>
# beside it, then `apachectl -k graceful`. WordPress is left installed and
# running underneath, so the old store comes straight back.

# --- zenshin-tech.com -> the LP-Research shop (added 2026-11-12) ---------
# The Zenshin store was consolidated into the LP-Research shop, which
# carries the same 28 SKUs at the same USD prices. WordPress is left
# installed and running underneath, so deleting this block restores the
# old store immediately: no DNS change, no propagation wait, no cert work.

# WordPress rewrites anything it does not recognise to /index.php, and that
# internal redirect re-enters these rules carrying a URI that no longer
# looks excluded - which is what sent /wp-json/ to the shop. Act only on
# the original external request.
RewriteCond %{ENV:REDIRECT_STATUS} !^$
RewriteRule "^" - [L]

# The load balancer polls / every 60 seconds and pulls the instance out of
# service if that stops succeeding, so its health check must never be
# redirected. Either signal identifies it: it sends no X-Forwarded-For and
# it names itself. Matching on both means a change to one does not
# silently take the site down.
RewriteCond %{HTTP_USER_AGENT} ^ELB-HealthChecker [OR]
RewriteCond %{HTTP:X-Forwarded-For} ^$
RewriteRule "^" - [L]

# Keep the admin surface and the assets it needs reachable, so the store
# can still be managed and reactivated while the redirect is in place.
RewriteRule "^/?(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|wp-cron\.php|\.well-known)(/.*)?$" - [L]

# Product permalinks -> the matching SKU. Each pattern is anchored so
# lpms-b2 cannot swallow lpms-b2-holder.
RewriteRule "^/?product/lpms-b2/?$" "https://www.lp-research.com/shop/lpms-b2" [R=301,L,E=ZENREDIR:1]
