# Pages with an equivalent on the LP-Research site. Both the old
# /contactus and /contact pages were titled "About Us".
RewriteRule "^/?contactus/?$" "https://www.lp-research.com/about-us-lp-research" [R=301,L,E=ZENREDIR:1]
RewriteRule "^/?contact/?$" "https://www.lp-research.com/about-us-lp-research" [R=301,L,E=ZENREDIR:1]
RewriteRule "^/?terms-of-service/?$" "https://www.lp-research.com/hardware-terms" [R=301,L,E=ZENREDIR:1]
RewriteRule "^/?privacy-and-policies/?$" "https://www.lp-research.com/privacy" [R=301,L,E=ZENREDIR:1]

# Everything else: the apex storefront, category and tag archives, cart,
# checkout, the account area, the old blog.
RewriteRule "^" "https://www.lp-research.com/shop" [R=301,L,E=ZENREDIR:1]

# Bound how long a browser remembers the redirect so a revert reaches
# customers at once. Search engines still honour the 301 as permanent.
Header always set Cache-Control "max-age=600" env=ZENREDIR
# --- end zenshin redirect ------------------------------------------------
