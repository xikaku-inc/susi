name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # Pinned to the image whose default compiler (gcc 13) has prebuilt
    # conancenter binaries.
    runs-on: ubuntu-24.04

    # With Conan installed, the susi_server build script builds the C++ client
    # for test_cpp_client_against_server, with the versions in cpp/conan-ci.lock.
    env:
      SUSI_CONAN_LOCKFILE: conan-ci.lock

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Conan
      run: |
        pip install conan
        conan profile detect
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  client-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run susi_client tests
      run: cargo test -p susi_client --verbose
