services:
  susi-server-staging:
    # Same image as production - staging differs only in env vars and
    # the data volume. See production compose for the rationale.
    image: susi:latest
    build: .
    container_name: susi-server-staging
    restart: unless-stopped
    # Bind to loopback only - nginx on the same host proxies
    # staging.susi.lp-research.com (TLS) here; 3101 is never public.
    ports:
      - "127.0.0.1:3101:3100"
    environment:
      - RUST_LOG=info
      # Sign-in code login (leave SUSI_SMTP_HOST empty to disable)
      - SUSI_SMTP_HOST=${SUSI_SMTP_HOST:-}
      - SUSI_SMTP_PORT=${SUSI_SMTP_PORT:-587}
      - SUSI_SMTP_USER=${SUSI_SMTP_USER:-}
      - SUSI_SMTP_PASSWORD=${SUSI_SMTP_PASSWORD:-}
      - SUSI_SMTP_FROM_NAME=${SUSI_SMTP_FROM_NAME:-Susi Staging}
      - SUSI_SMTP_FROM_ADDR=${SUSI_SMTP_FROM_ADDR:-}
      # Always staging - don't let the shared .env leak the production URL into password-reset / invitation emails
      - SUSI_MAGIC_LINK_BASE_URL=https://staging.susi.lp-research.com
      # Newsletter sending is HARD-DISABLED on staging. The .env file is shared
      # with production, so passing the credentials through would let a staging
      # test mail the real customer base. Drafts, previews and the audience
      # panel all still work; only the send path is unavailable.
      - SUSI_NEWSLETTER_SMTP_HOST=
      # Same reasoning for the Gmail connector: no OAuth client on staging, so
      # a staging admin cannot connect an account and start sending.
      - SUSI_GOOGLE_CLIENT_ID=
      - SUSI_GOOGLE_CLIENT_SECRET=
      # Owners are still useful on staging (the composer and preview work
      # there); only sending is disabled above.
      - SUSI_OWNER_EMAILS=${SUSI_OWNER_EMAILS:-}
      # FusionHub relay URL handed to workspace members on federation fetch.
      # Empty disables the relay (members fall back to FUSIONHUB_RELAY_URL
      # set locally on each member, or direct TCP only).
      - SUSI_RELAY_URL=${SUSI_RELAY_URL:-}
      # Shop / Stripe (test keys live in /opt/susi/.env on the host)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # LPR shop Stripe account; staging always runs on the LP sandbox keys.
      - STRIPE_SECRET_KEY_LPR=${STRIPE_SECRET_KEY_LPR_TEST:-}
      - STRIPE_WEBHOOK_SECRET_LPR=${STRIPE_WEBHOOK_SECRET_LPR_TEST:-}
      - SUSI_SHOP_BASE_URL=${SUSI_SHOP_BASE_URL:-https://staging.susi.lp-research.com}
      - SUSI_SHOP_NOTIFY_ADDR=${SUSI_SHOP_NOTIFY_ADDR:-}
      # Contact form (empty contact-to-addr disables; turnstile keys optional)
      - SUSI_CONTACT_TO_ADDR=${SUSI_CONTACT_TO_ADDR:-}
      - SUSI_TURNSTILE_SECRET=${SUSI_TURNSTILE_SECRET:-}
      - SUSI_TURNSTILE_SITE_KEY=${SUSI_TURNSTILE_SITE_KEY:-}
      # S3 for workspace recordings (shares the production bucket; objects
      # are namespaced under workspaces/{id}/recordings/ either way).
      - SUSI_S3_BUCKET=${SUSI_S3_BUCKET:-}
      - SUSI_S3_REGION=${SUSI_S3_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Dropbox backups: shares the prod app + encryption key from
      # /opt/susi/.env, but archives are always prefixed `staging` so
      # rotation never touches the production archives.
      - SUSI_DROPBOX_APP_KEY=${SUSI_DROPBOX_APP_KEY:-}
      - SUSI_DROPBOX_APP_SECRET=${SUSI_DROPBOX_APP_SECRET:-}
      - SUSI_BACKUP_KEY=${SUSI_BACKUP_KEY:-}
      - SUSI_BACKUP_PREFIX=staging
      - SUSI_TRUSTED_PROXIES=${SUSI_TRUSTED_PROXIES:-}
    volumes:
      - susi-data-staging:/data
    # Same log cap as production - stdout must not accumulate indefinitely.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  susi-data-staging:
    name: susi-data-staging
