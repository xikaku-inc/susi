# Public site: xikaku.com -> 127.0.0.1:3100 (same backend container as susi.lp-research.com)
#
# Edge rate limit: per-IP request budget on the API. The backend has its own
# per-endpoint limits; this caps bulk/scripted traffic before it reaches it.
limit_req_zone $binary_remote_addr zone=xikaku_api:10m rate=10r/s;
#
# URL strategy:
# - / serves the public Xikaku homepage (backend /site)
# - /{slug} serves the matching website page (backend /site/{slug})
# - Legacy /site and /site/{slug} 301 -> clean form (consolidates SEO equity)
# - /home 301 -> / so the home page has exactly one canonical URL
# - Known top-level paths (/api, /shop, /docs, /static, /robots.txt, etc.) pass through
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xikaku.com;

    ssl_certificate     /etc/letsencrypt/live/xikaku.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xikaku.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Server;

    # Explicit access log; rotation is the distro logrotate policy
    # (/etc/logrotate.d/nginx: daily, 14 rotations) - IPs age out with it.
    access_log /var/log/nginx/xikaku.access.log;

    client_max_body_size 200m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Eliminate duplicate URLs: /home is the same content as /, send Google to one.
    location = /home  { return 301 https://xikaku.com/; }
    location = /home/ { return 301 https://xikaku.com/; }

    # Legacy /site* URLs -> 301 to clean form
    location = /site  { return 301 https://xikaku.com/; }
    location = /site/ { return 301 https://xikaku.com/; }
    location ~ ^/site/(.+)$ { return 301 https://xikaku.com/$1; }

    # Apex / -> backend /site (Xikaku public homepage)
    location = / {
        proxy_pass http://127.0.0.1:3100/site;
    }

    # Known top-level paths, passthrough
    location /api          { limit_req zone=xikaku_api burst=30 nodelay; proxy_pass http://127.0.0.1:3100; }
    location /shop         { proxy_pass http://127.0.0.1:3100; }
    location /docs         { proxy_pass http://127.0.0.1:3100; }
    location /static       { proxy_pass http://127.0.0.1:3100; }
    location = /robots.txt   { proxy_pass http://127.0.0.1:3100; }
    location = /sitemap.xml  { proxy_pass http://127.0.0.1:3100; }
    location = /llms.txt     { proxy_pass http://127.0.0.1:3100; }
    location = /favicon.ico  { proxy_pass http://127.0.0.1:3100; }
    location = /health       { proxy_pass http://127.0.0.1:3100; }
    location /.well-known    { proxy_pass http://127.0.0.1:3100; }

    # IndexNow verification key file: <32-hex>.txt at the root, proxied to
    # the susi backend route. Regex quoted so nginx doesn't confuse {32} with
    # block syntax.
    location ~ "^/([a-f0-9]{32}\.txt)$" { proxy_pass http://127.0.0.1:3100/api/v1/indexnow/$1; }

    # Catch-all: clean URL form /{slug} -> backend /site/{slug}
    location / {
        rewrite ^/(.+)$ /site/$1 break;
        proxy_pass http://127.0.0.1:3100;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xikaku.com;

    ssl_certificate     /etc/letsencrypt/live/xikaku.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xikaku.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://xikaku.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name xikaku.com www.xikaku.com;
    return 301 https://xikaku.com$request_uri;
}
