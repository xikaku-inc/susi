# Production: susi.lp-research.com -> 127.0.0.1:3100
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name susi.lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/susi.lp-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/susi.lp-research.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_hide_header Server;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name susi.lp-research.com;
    return 301 https://$host$request_uri;
}

