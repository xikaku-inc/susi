# Edge rate limit shared by the prod + staging portal hosts.
limit_req_zone $binary_remote_addr zone=susi_api:10m rate=10r/s;

# Production: susi.lp-research.com -> 127.0.0.1:3100
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name susi.lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/susi.lp-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/susi.lp-research.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Server;

    # Explicit access log; rotation is the distro logrotate policy
    # (/etc/logrotate.d/nginx: daily, 14 rotations) - IPs age out with it.
    access_log /var/log/nginx/susi.access.log;

    client_max_body_size 500m;

    location /api {
        limit_req zone=susi_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name susi.lp-research.com;
    return 301 https://$host$request_uri;
}

# Staging: staging.susi.lp-research.com -> 127.0.0.1:3101
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name staging.susi.lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/staging.susi.lp-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.susi.lp-research.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Server;

    # Explicit access log, same retention note as production.
    access_log /var/log/nginx/susi-staging.access.log;

    client_max_body_size 500m;

    location /api {
        limit_req zone=susi_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name staging.susi.lp-research.com;
    return 301 https://$host$request_uri;
}
