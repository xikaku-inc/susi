# Public site: www.lp-research.com -> 127.0.0.1:3100 (same backend container
# as xikaku.com and susi.lp-research.com; the backend resolves the site from
# the Host header, see crates/susi_server/src/sites.rs).
#
# Canonical host is www.lp-research.com (matches the WordPress-era canonicals,
# preserving existing backlinks with a single 301 at most). The apex redirects
# to www.
#
# Edge rate limit: per-IP request budget on the API. The backend has its own
# per-endpoint limits; this caps bulk/scripted traffic before it reaches it.
limit_req_zone $binary_remote_addr zone=lpr_api:10m rate=10r/s;
#
# URL strategy (same as xikaku.com):
# - / serves the public homepage (backend /site)
# - /{slug} serves the matching website page (backend /site/{slug})
# - Legacy /site and /site/{slug} 301 -> clean form
# - Known top-level paths (/api, /static, /robots.txt, etc.) pass through
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/lp-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp-research.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Server;

    access_log /var/log/nginx/lp-research.access.log;

    client_max_body_size 200m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WordPress-era URLs all end in '/' - strip it once at the edge so every
    # URL has exactly one canonical form.
    rewrite ^/(.+)/$ /$1 permanent;

    # Legacy /site* URLs -> 301 to clean form
    location = /site  { return 301 https://www.lp-research.com/; }
    location = /site/ { return 301 https://www.lp-research.com/; }
    location ~ ^/site/(.+)$ { return 301 https://www.lp-research.com/$1; }

    # Apex / -> backend /site (public homepage)
    location = / {
        proxy_pass http://127.0.0.1:3100/site;
    }

    # Customer area stays on the legacy WordPress install until it is
    # migrated. Uncomment and point at the WP origin at cutover.
    # location /customer-area { proxy_pass https://<wp-origin>; proxy_set_header Host www.lp-research.com; }
    # location /wp-content    { proxy_pass https://<wp-origin>; proxy_set_header Host www.lp-research.com; }
    # location /wp-login.php  { proxy_pass https://<wp-origin>; proxy_set_header Host www.lp-research.com; }

    # Known top-level paths, passthrough
    location /api          { limit_req zone=lpr_api burst=30 nodelay; proxy_pass http://127.0.0.1:3100; }
    location /static       { proxy_pass http://127.0.0.1:3100; }
    location = /robots.txt   { proxy_pass http://127.0.0.1:3100; }
    location = /sitemap.xml  { proxy_pass http://127.0.0.1:3100; }
    location = /llms.txt     { proxy_pass http://127.0.0.1:3100; }
    location = /favicon.ico  { proxy_pass http://127.0.0.1:3100; }
    location = /health       { proxy_pass http://127.0.0.1:3100; }
    location /.well-known    { proxy_pass http://127.0.0.1:3100; }

    # IndexNow verification key file: <32-hex>.txt at the root, proxied to
    # the susi backend route. Regex quoted so nginx doesn't confuse {32} with
    # block syntax.
    location ~ "^/([a-f0-9]{32}\.txt)$" { proxy_pass http://127.0.0.1:3100/api/v1/indexnow/$1; }

    # Catch-all: clean URL form /{slug} -> backend /site/{slug}
    location / {
        rewrite ^/(.+)$ /site/$1 break;
        proxy_pass http://127.0.0.1:3100;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/lp-research.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp-research.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://www.lp-research.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lp-research.com www.lp-research.com;
    return 301 https://www.lp-research.com$request_uri;
}
