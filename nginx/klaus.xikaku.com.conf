# Public site: klaus.xikaku.com -> 127.0.0.1:3100 (Klaus's personal site,
# served by the same backend container as xikaku.com; the site is resolved
# from the Host header via the dynamic site registry).
#
# PRE-LAUNCH: the robots override + X-Robots-Tag below keep the site out of
# search indexes while it is under construction (before the "klaus" site
# exists in the prod registry, this host falls back to the default site's
# content). Remove both when the site goes live.
#
# Install (after the name resolves to the box):
#   sudo certbot certonly --nginx --cert-name klaus.xikaku.com -d klaus.xikaku.com
#   scp this file to /etc/nginx/conf.d/klaus.xikaku.conf
#   sudo nginx -t && sudo systemctl reload nginx
limit_req_zone $binary_remote_addr zone=klaus_api:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name klaus.xikaku.com;

    ssl_certificate     /etc/letsencrypt/live/klaus.xikaku.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klaus.xikaku.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # PRE-LAUNCH: remove when the site goes live.
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header Server;

    access_log /var/log/nginx/klaus.access.log;

    client_max_body_size 200m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PRE-LAUNCH: remove when the site goes live (the backend then serves a
    # proper per-site robots.txt).
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Legacy /site* URLs -> 301 to clean form
    location = /site  { return 301 https://klaus.xikaku.com/; }
    location = /site/ { return 301 https://klaus.xikaku.com/; }
    location ~ ^/site/(.+)$ { return 301 https://klaus.xikaku.com/$1; }

    # Apex / -> backend /site (public homepage)
    location = / {
        proxy_pass http://127.0.0.1:3100/site;
    }

    # Known top-level paths, passthrough
    location /api          { limit_req zone=klaus_api burst=30 nodelay; proxy_pass http://127.0.0.1:3100; }
    location /static       { proxy_pass http://127.0.0.1:3100; }
    location = /sitemap.xml  { proxy_pass http://127.0.0.1:3100; }
    location = /llms.txt     { proxy_pass http://127.0.0.1:3100; }
    location = /favicon.ico  { proxy_pass http://127.0.0.1:3100; }
    location = /health       { proxy_pass http://127.0.0.1:3100; }
    location /.well-known    { proxy_pass http://127.0.0.1:3100; }

    # Catch-all: clean URL form /{slug} -> backend /site/{slug}
    location / {
        rewrite ^/(.+)$ /site/$1 break;
        proxy_pass http://127.0.0.1:3100;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name klaus.xikaku.com;
    return 301 https://klaus.xikaku.com$request_uri;
}
