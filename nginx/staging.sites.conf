# Staging vhosts for the public sites: staging.xikaku.com and
# staging.lp-research.com -> 127.0.0.1:3101 (the susi-server-staging
# container). Production keeps xikaku.com / www.lp-research.com on :3100 and
# the dashboard keeps staging.susi.lp-research.com, so each site is reviewed
# under its own hostname exactly as it will serve live.
#
# URL strategy is copied from the production vhosts (clean /{slug} URLs, the
# trailing slash stripped once at the edge, legacy /site* consolidated), so a
# page that works here works there.
#
# Search engines are refused outright: staging serves the same content as
# production and must never compete with it in the index.
#
# Install (after both names resolve to the box):
#   scp this file to /etc/nginx/conf.d/staging-sites.conf
#   sudo certbot --nginx -d staging.xikaku.com -d staging.lp-research.com
#   sudo nginx -t && sudo systemctl reload nginx
# certbot uses the nginx authenticator here, so it serves the ACME challenge
# itself; one SAN cert covers both names under staging.xikaku.com/.
limit_req_zone $binary_remote_addr zone=staging_api:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.xikaku.com staging.lp-research.com;

    ssl_certificate     /etc/letsencrypt/live/staging.xikaku.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.xikaku.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header Server;

    access_log /var/log/nginx/staging-sites.access.log;

    client_max_body_size 200m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep crawlers out of staging; the backend's own robots.txt is for the
    # production hosts.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # WordPress-era URLs all end in '/' - strip it once at the edge so every
    # URL has exactly one canonical form.
    rewrite ^/(.+)/$ /$1 permanent;

    # Legacy /site* URLs -> 301 to clean form
    location = /site  { return 301 https://$host/; }
    location = /site/ { return 301 https://$host/; }
    location ~ ^/site/(.+)$ { return 301 https://$host/$1; }

    # Apex / -> backend /site (public homepage)
    location = / {
        proxy_pass http://127.0.0.1:3101/site;
    }

    # Known top-level paths, passthrough
    location /api          { limit_req zone=staging_api burst=30 nodelay; proxy_pass http://127.0.0.1:3101; }
    location /shop         { proxy_pass http://127.0.0.1:3101; }
    location /static       { proxy_pass http://127.0.0.1:3101; }
    location = /sitemap.xml  { proxy_pass http://127.0.0.1:3101; }
    location = /llms.txt     { proxy_pass http://127.0.0.1:3101; }
    location = /favicon.ico  { proxy_pass http://127.0.0.1:3101; }
    location = /health       { proxy_pass http://127.0.0.1:3101; }
    location /.well-known    { proxy_pass http://127.0.0.1:3101; }

    # Catch-all: clean URL form /{slug} -> backend /site/{slug}
    location / {
        rewrite ^/(.+)$ /site/$1 break;
        proxy_pass http://127.0.0.1:3101;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.xikaku.com staging.lp-research.com;
    return 301 https://$host$request_uri;
}
